# Blocks map for the decision-card lock, B v9 (CHE-5793 C2).
# One case per state the lock draws (its numbered label): lock file, state id, profile id, fixture.
# State id s<N> is the lock label number N. Block ids are data-testid values the code carries today;
# blocks the lock draws that the code does not yet tag (options, composer, buttons) join in step 5.
# A case's `blocks` lists the block ids its state draws. Rule 3 judges a block absent on both sides only when the case lists it;
# a block present on one side is always judged. A block with `repeat` may match several elements (s18 meta, s25 card twice, s13 notes).
# A block's selector may list the open-card and the decided-card (.cc) form of the same block.
# A case names the fixture that draws its data. `steps` (click / type, run in order) bring the real component to the
# lock's interaction state. A case whose fixture the harness lacks fails `missing-render`; it is never drawn as another state.
topic: decision-card
