# Live route manifest (CHE-5793 C9). One entry per in-scope page.tsx and per Settings tab.
# Checked by: node scripts/design/live/manifest.mjs --check
# Live key = route/<screen>/<state>/<profile>/<theme> (scripts/design/live/keys.mjs).
#
# path   : the route template of the page.tsx. [workspaceSlug] is the seeded workspace slug; every other
#          [param] is filled from `seed` (param -> record kind) by the seed script (steps 32 and 33).
#          Seeded records are named "Live seed <kind>" so a detail marker can name them.
# auth   : anonymous | owner | new-user | no-workspace | invitee (C9 auth states).
# expect : url is a regex for the final path; marker is {role, name} or {testid} that only this screen shows.
# Markers are written from the English locale and the page components. Step 32 (route check) confirms each
# one against the live instance and corrects any that read screen-mismatch.
# scenes : ui-map.yml screen ids the route shows (golden scenes, step 10c). Empty until those exist.
# A Settings tab that the local configuration hides gets `config: <flag>=<value>` (step 32 sets it).
project: 5e621e12-eeb4-40a5-9571-25657d5b0ec5
canvas: mRAnnjvGod
