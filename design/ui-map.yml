# UI ownership map (CHE-5793 C3). A gate path: a change waits 24 h after its last PASS.
# Checked by scripts/design/check-ui-map.mjs (rules 1 to 4); the ui-fidelity job (steps 8, 8b) adds the trigger and the ratchet.
#
# legacy.seed_sha: the commit this map was seeded on. A UI file owned only by legacy must sit in a directory that
#   exists there; a lock pin that equals the pin at that commit may stay `unmapped`.
# entries: one per lock folder design/<topic>/approved/. state `building` (fidelity check runs), `shipped` (goldens), `unmapped`.
#   state `upstream` is for a screen that came from the upstream project and has no design lock here: it lists the
#   `paths` and `routes` it owns and has no lock fields. Give a screen a lock entry when a design is drawn for it.
#   lock_export_sha256 is the lock's LOCK.json export_sha256 (a per-file object is pinned as the sha256 of its sorted
#   sha256sum lines). Whoever merges second of a design PR and a code PR updates the pin.
legacy:
  seed_sha: "7de674174fcabc671e1a2510bfdc1f275a13a8c2"

