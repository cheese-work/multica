<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DM agent-message comments — rev-1 B</title><link rel="stylesheet" href="shared.css"></head>
<body><main class="board">
<div class="board-head"><h1>Direction B — Notes stay visible</h1><p>Same markers and floating button. The comments sit as cards above the composer, so quote and note are visible without opening a list. More than three collapse to “+N more”.</p></div>
<div class="grid">
<figure class="frame " style="margin:0"><figcaption class="cap"><b>1 · Select text</b><span>settled reply; button above the selection</span></figcaption><div class="stage chatstage"><div class="chat"><div class="chat-head"><span class="av">T</span><b>Terra</b><span class="st"><span class="dot"></span>Online</span></div><div class="col msgs"><div class="m-user"><div class="ub"><p>Why does a claim fail twice in a row on a slow network?</p></div></div><div class="m-agent "><div class="body"><div class="md">
<p>I traced the retry path. The daemon retries a failed claim three times, then marks the task failed.</p>
<div class="blk rel" style="margin-top:48px"><div class="pop menu" style="left:0;top:-40px;"><button class="btn sm ghost" type="button"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v6M9 10h6"/></svg>Add comment</button></div><p><span class="hl sel">The delay is fixed at 5 seconds.</span> A burst of failures reaches the server at the same moment, so I suggest exponential backoff with jitter:</p></div>
<ul><li class="rel">Start at 1 s and double up to a 30 s cap.</li><li>Add ±20% jitter.</li><li>Keep the three-attempt limit.</li></ul>
</div></div><div class="foot">Replied in 38s <button class="btn icon-xs ghost faint" aria-label="Copy"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button></div></div></div><div class="composer col"><div class="cmp "><span class="ph">Message Terra…</span><div class="tools"><button class="btn icon-sm ghost" aria-label="Add"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div><button class="btn icon-sm default send" aria-label="Send" ><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></div></div></div></figure>
<figure class="frame " style="margin:0"><figcaption class="cap"><b>2 · Write the comment</b><span>button swaps to a note box; Enter adds, Esc cancels</span></figcaption><div class="stage chatstage"><div class="chat"><div class="chat-head"><span class="av">T</span><b>Terra</b><span class="st"><span class="dot"></span>Online</span></div><div class="col msgs"><div class="m-user"><div class="ub"><p>Why does a claim fail twice in a row on a slow network?</p></div></div><div class="m-agent "><div class="body"><div class="md">
<p>I traced the retry path. The daemon retries a failed claim three times, then marks the task failed.</p>
<div class="blk rel" style="margin-top:120px"><div class="pop note" style="left:0;top:-118px"><div class="ta " role="textbox" aria-label="Comment">Why 5 s? Is it set anywhere?</div>
<div class="acts"><button class="btn sm default" >Add</button></div></div><p><span class="hl sel">The delay is fixed at 5 seconds.</span> A burst of failures reaches the server at the same moment, so I suggest exponential backoff with jitter:</p></div>
<ul><li class="rel">Start at 1 s and double up to a 30 s cap.</li><li>Add ±20% jitter.</li><li>Keep the three-attempt limit.</li></ul>
</div></div><div class="foot">Replied in 38s <button class="btn icon-xs ghost faint" aria-label="Copy"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button></div></div></div><div class="composer col"><div class="cmp "><span class="ph">Message Terra…</span><div class="tools"><button class="btn icon-sm ghost" aria-label="Add"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div><button class="btn icon-sm default send" aria-label="Send" ><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></div></div></div></figure>
<figure class="frame " style="margin:0"><figcaption class="cap"><b>3 · Two comments saved</b><span>markers and highlights on the reply; comments above the composer</span></figcaption><div class="stage chatstage"><div class="chat"><div class="chat-head"><span class="av">T</span><b>Terra</b><span class="st"><span class="dot"></span>Online</span></div><div class="col msgs"><div class="m-user"><div class="ub"><p>Why does a claim fail twice in a row on a slow network?</p></div></div><div class="m-agent "><div class="body"><div class="md">

<div class="blk rel" style="margin-top:8px"><p><span class="hl ">The delay is fixed at 5 seconds.</span> A burst of failures reaches the server at the same moment, so I suggest exponential backoff with jitter:</p><span class="mk" style="position:absolute;right:-32px;top:-2px">1</span></div>

<figure class="frame " style="margin:0"><figcaption class="cap"><b>4 · Sent</b><span>comments are cleared; the bubble is plain Markdown the agent reads as written</span></figcaption><div class="stage chatstage"><div class="chat"><div class="chat-head"><span class="av">T</span><b>Terra</b><span class="st"><span class="dot"></span>Online</span></div><div class="col msgs"><div class="m-user"><div class="ub"><p>Why does a claim fail twice in a row on a slow network?</p></div></div><div class="m-agent "><div class="body"><div class="md">

</div></div><div class="foot">Replied in 38s <button class="btn icon-xs ghost faint" aria-label="Copy"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button></div></div><div class="m-user"><div class="ub"><blockquote><p>The delay is fixed at 5 seconds.</p></blockquote><p>Why 5 s? Is it set anywhere?</p><div class="gap"></div><blockquote><p>double up to a 30 s cap</p></blockquote><p>Cap at 15 s. Longer looks stuck in the UI.</p><hr><p>Go with 15 s. Keep the rest.</p></div></div></div><div class="composer col"><div class="cmp "><span class="ph">Message Terra…</span><div class="tools"><button class="btn icon-sm ghost" aria-label="Add"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div><button class="btn icon-sm default send" aria-label="Send" ><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></div></div></div></figure>
