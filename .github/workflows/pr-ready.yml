# ci-policy: class=gate
# Required `pr-ready` check, PR half (CHE-3440). Canonical copy: cheese-work/dotfiles-agents
# .github/workflows/pr-ready.yml; tests live there (tests/test_che3440_pr_ready.py). The merge-queue half is
# pr-ready-queue.yml. Fails while the PR body says the work is unfinished OR no trusted cross-lab PASS names the
# current head (docs/pr-ready.md). Register `pr-ready` as a required check only after a readback of the check on a
# real PR and a real queue run; this file alone blocks nothing.
#
# SECURITY: `pull_request_target` runs THIS definition from the default branch, and the job checks out the DEFAULT
# branch only. Nothing from a PR head is fetched, checked out or run; the body and comments are read through the API
# as data. Permissions are read-only and there is no secret. The merge_group trigger is NOT here: GitHub runs a
# merge_group workflow from the queue commit, which a queued PR can edit, so that half lives in its own file on a
# GitHub-hosted runner and never on a self-hosted one.

name: pr-ready
# The recheck workflow finds this PR's run by this name (two PRs can share one head SHA). Trusted: this definition
# runs from the default branch, and the number is an integer.
run-name: pr-ready-${{ github.event.pull_request.number }}

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: pr-ready-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-ready:
    name: pr-ready
    runs-on: ${{ github.repository_owner == 'cheese-work' && fromJSON('["self-hosted","Linux","X64","cheese-x99-gate"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
      REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Discard a reused workspace
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
      - name: Check out the protected default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Judge the PR body and the verdict
        run: python3 .github/pr-ready/pr_ready.py
