# CHE-3960: weekly stale check for docs/fork/ (see docs/fork/PROCESS.md, "Ledger refresh"). Exit 1 = ledger stale = red run.
# The Monday brief's CI-health scan reads a red scheduled run on the default branch (red_scheduled) and files one fix(ci)
# issue for the dev team, so a stale ledger reaches an owner without any new credential. Public data only; read-only token.
# Schedule is the only trigger: GitHub runs it on the default branch only.
name: fork-ledger-stale

on:
  schedule:
    - cron: "30 16 * * 0" # Sunday 23:30 ICT, before the Monday 09:00 ICT brief

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check the ledger pin against upstream main
        run: node scripts/fork-ledger-stale.mjs
