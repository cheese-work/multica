name: Agent adoption issue

# CHE-2794: after a C00 deploy that actually ran and passed its health/digest/SHA readback
# (cd-deploy.yml's "Record outcome" step succeeded), open or reuse ONE adoption issue for the
# deployed SHA listing the agent-facing PRs since the previous deployed SHA and the CLI readback
# each agent host needs before any instruction is applied. No agent-facing PR: log it, open nothing.
#
# Separate workflow on purpose: it reads the deploy run and can never change deploy or rollback
# behaviour. The job applies no instruction; that stays in multica-cheese-work-instruction-change.
#
# Needs on the runner: the `multica` CLI. Needs configured: secret MULTICA_TOKEN and variables
# MULTICA_SERVER_URL, MULTICA_WORKSPACE_ID, ADOPTION_PROJECT_ID, ADOPTION_ASSIGNEE_ID. When one is
# unset the job fails with an error naming it and opens nothing.
# The CHE-2793 map generator (scripts/upstream_sync_plan.py in the private cheese-work/multica-dotfiles)
# is fetched at ADOPTION_GENERATOR_REF (default main) with secret ADOPTION_GENERATOR_TOKEN (read access
# to that repo) and run in fork-range mode. A missing token, a failed fetch, a failing generator or an
# empty map fails the job before any issue is opened. Optional variable ADOPTION_MAP_CMD replaces the
# generator command; it gets ADOPTION_PREV, ADOPTION_NEXT and ADOPTION_REPO and prints the map.
on:
  workflow_run:
    workflows: ["CD deploy to C00"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: agent-adoption
  cancel-in-progress: false

jobs:
  adoption:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, x64, cheese-x99]
    timeout-minutes: 15
    steps:
      - name: Confirm the deploy ran and passed its readback
        id: deployed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          outcome="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.name == "deploy") | .steps[] | select(.name == "Record outcome") | .conclusion')"
          if [ "$outcome" = "success" ]; then
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "No deploy readback in this run (Record outcome: '${outcome:-skipped}'); no adoption issue."
            echo "ran=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.deployed.outputs.ran == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.deployed.outputs.ran == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download the admitted deploy input
        if: steps.deployed.outputs.ran == 'true'
        uses: actions/download-artifact@v8
        with:
          name: cd-deploy-admitted-input
          path: cutover-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Fetch the adoption map generator
        id: generator
        if: steps.deployed.outputs.ran == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ADOPTION_GENERATOR_TOKEN }}
          GENERATOR_REF: ${{ vars.ADOPTION_GENERATOR_REF || 'main' }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ADOPTION_GENERATOR_TOKEN is not configured; the adoption map generator cannot be fetched."
            exit 1
          fi
          path="$RUNNER_TEMP/upstream_sync_plan.py"
          gh api "repos/cheese-work/multica-dotfiles/contents/scripts/upstream_sync_plan.py?ref=$GENERATOR_REF" \
            -H 'Accept: application/vnd.github.raw+json' > "$path"
          [ -s "$path" ] || { echo "::error::generator fetched empty from ref $GENERATOR_REF"; exit 1; }
          python3 "$path" fork-range --help > /dev/null
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Build the adoption issue
        id: plan
        if: steps.deployed.outputs.ran == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ADOPTION_GENERATOR: ${{ steps.generator.outputs.path }}
          ADOPTION_MAP_CMD: ${{ vars.ADOPTION_MAP_CMD }}
        run: |
          set -euo pipefail
          next="$(node -p 'JSON.parse(require("fs").readFileSync("cutover-input/manifest.json","utf8")).source_sha')"
          prev="$(node -p 'JSON.parse(require("fs").readFileSync("cutover-input/baseline-tuple.json","utf8")).application_sha')"
          node scripts/agent-adoption.mjs plan --prev "$prev" --next "$next" --repo "$GITHUB_REPOSITORY" --out adoption | tee plan.log
          tail -n 1 plan.log >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          head -n 1 plan.log >> "$GITHUB_STEP_SUMMARY"

      - name: Open or reuse the adoption issue
        if: steps.plan.outputs.issue == 'true'
        shell: bash
        env:
          MULTICA_TOKEN: ${{ secrets.MULTICA_TOKEN }}
          MULTICA_SERVER_URL: ${{ vars.MULTICA_SERVER_URL }}
          MULTICA_WORKSPACE_ID: ${{ vars.MULTICA_WORKSPACE_ID }}
          PROJECT_ID: ${{ vars.ADOPTION_PROJECT_ID }}
          ASSIGNEE_ID: ${{ vars.ADOPTION_ASSIGNEE_ID }}
          NEXT_SHA: ${{ steps.plan.outputs.next }}
        run: |
          set -euo pipefail
          for name in MULTICA_TOKEN MULTICA_SERVER_URL MULTICA_WORKSPACE_ID PROJECT_ID ASSIGNEE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured; adoption issue not opened. The body is in this run's step summary."
              cat adoption/body.md >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          title="$(cat adoption/title.txt)"
          # One issue per deployed SHA: search by the 12-character title, then match the full SHA in the
          # body marker. A failed or unreadable lookup stops the job; it never falls through to create.
          search="$(multica issue search "$title" --include-closed --limit 100 --output json)"
          rc=0
          existing="$(printf '%s' "$search" | node scripts/agent-adoption.mjs reuse --next "$NEXT_SHA")" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "Adoption issue $existing already exists for $NEXT_SHA; reusing it."
            exit 0
          elif [ "$rc" -ne 1 ]; then
            echo "::error::Adoption issue lookup failed (exit $rc); not creating a possible duplicate."
            exit 1
          fi
          # Project, assignee and Readiness at creation (CHE-466).
          multica issue create --title "$title" --description-file adoption/body.md \
            --project "$PROJECT_ID" --assignee-id "$ASSIGNEE_ID" --status todo \
            --property 'Readiness=ready' --output json
