name: CD qualification build

on:
  push:
    branches: [main]

# This workflow deliberately has no deployment environment, C00 endpoint,
# deployment token, SSH material, recovery key, or configuration secret. D2
# owns C00 mutation after D1 produces a current-tuple candidate.
permissions:
  contents: read
  packages: write

concurrency:
  group: cd-qualification-build-${{ github.ref }}
  # One running + one pending run per group: a newer push replaces only the
  # pending run, never a build already in progress.
  cancel-in-progress: false

jobs:
  fork-changelog:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    env:
      FORK_CHANGELOG_START: '2026-10-11'
    steps:
      - name: Checkout qualified source without persisted credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Fetch bounded first-parent history and fork entries
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! timeout 180 git fetch --shallow-since="${FORK_CHANGELOG_START}T00:00:00+07:00" origin "$GITHUB_SHA"; then
            echo '::warning::Fork entries unavailable for this build: history fetch failed'
            echo 'Fork entries unavailable for this build.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/fork-changelog-fetch.mjs --sha "$GITHUB_SHA" --out apps/web/.fork-changelog/entries.json

      - name: Upload fork entries when available
        if: ${{ hashFiles('apps/web/.fork-changelog/entries.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: fork-changelog-${{ github.sha }}
          path: apps/web/.fork-changelog/entries.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  cd-qualification:
    needs: fork-changelog
    if: ${{ always() && !cancelled() }}
    # This label is reserved for the separate cheese-work runner set on X99;
    # it cannot match the unrelated tevo-web runners labeled tevo-cicd.
    runs-on: [self-hosted, linux, x64, cheese-x99]
    # 60, not 45: a busy X99 stretched the two image builds to 44+ minutes
    # (run 39791027247, attempt 1) and the cancel skipped the C00 deploy.
    timeout-minutes: 60
    env:
      REGISTRY: ghcr.io
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/multica-backend
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/multica-web
      # One named builder per X99 runner, kept between runs so BuildKit cache
      # mounts (Go build cache, .next/cache) survive (CHE-2415).
      BUILDER: cheese-x99-cd
    steps:
      - name: Assert trusted main push on X99 amd64
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          test "$(uname -m)" = x86_64
          test "${GITHUB_REPOSITORY}" = cheese-work/multica
          docker version --format '{{.Server.Arch}}' | grep -Ex 'amd64|x86_64'

      # Heals workspaces a past sparse checkout left with core.sparseCheckout=true: the
      # checkout action's own disable is undone when it unsets extensions.worktreeConfig (CHE-1961).
      - name: Reset leaked sparse-checkout state
        run: |
          [ -d "$GITHUB_WORKSPACE/.git" ] || exit 0
          git -C "$GITHUB_WORKSPACE" config --local --unset-all core.sparseCheckout || true
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download optional fork entries
        id: fork-entries
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: fork-changelog-${{ github.sha }}
          path: apps/web/.fork-changelog

      - name: Discard incomplete optional artifact
        if: ${{ steps.fork-entries.outcome != 'success' }}
        shell: bash
        run: |
          rm -f apps/web/.fork-changelog/entries.json
          echo 'Fork entries unavailable for this build.' >> "$GITHUB_STEP_SUMMARY"

      - name: Run D1 fixture checks
        shell: bash
        run: |
          set -euo pipefail
          bash deploy/cd/test-release-manifest.sh
          bash deploy/cd/test-admission.sh
          bash deploy/cd/test-record-checks.sh
          python3 deploy/cd/test-candidate-preflight.py
          python3 deploy/cd/test-deploy-approval.py
          bash deploy/cd/test-workflow-path-filters.sh
          bash deploy/cd/test-isolated-qualification.sh
          bash deploy/cd/test-tuple-snapshot.sh

      # The Docker driver on X99 cannot emit provenance or SBOM attestations.
      # Keep those release requirements on a docker-container builder, but
      # reuse it: a fresh builder per run starts with empty compile caches.
      - name: Use the persistent attestation-capable Buildx builder
        shell: bash
        run: |
          set -euo pipefail
          docker buildx inspect "$BUILDER" >/dev/null 2>&1 || docker buildx create --name "$BUILDER" --driver docker-container --bootstrap

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both images build at once on the runner's 4 GiB dind (checked: docker
      # inspect cheese-x99-dind-N, Memory=4294967296). The warm Go cache keeps
      # the backend compile small, so Next.js stays the memory peak.
      - name: Build and publish immutable amd64 backend and web
        shell: bash
        run: |
          set -euo pipefail
          upstream_version="$(tr -d '[:space:]' < UPSTREAM_VERSION)"
          if [[ ! "$upstream_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid UPSTREAM_VERSION: '$upstream_version'."
            exit 1
          fi
          build_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          build_stamp="$(sh scripts/release-stamp.sh "$build_date")"
          docker buildx build \
            --builder "$BUILDER" \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom=true \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --build-arg "VERSION=${upstream_version}" \
            --build-arg "BUILD=${build_stamp}" \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            --metadata-file backend-metadata.json \
            --push \
            --tag "${BACKEND_IMAGE}:sha-${GITHUB_SHA}" \
            --file Dockerfile . > backend-build.log 2>&1 &
          backend_pid=$!
          docker buildx build \
            --builder "$BUILDER" \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom=true \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --build-arg "NEXT_PUBLIC_APP_VERSION=${upstream_version}" \
            --build-arg "NEXT_PUBLIC_APP_BUILD=${build_stamp}" \
            --build-arg "NEXT_PUBLIC_APP_COMMIT=${GITHUB_SHA}" \
            --build-arg "NEXT_PUBLIC_BUILD_DATE=${build_date}" \
            --metadata-file web-metadata.json \
            --push \
            --tag "${WEB_IMAGE}:sha-${GITHUB_SHA}" \
            --file Dockerfile.web . > web-build.log 2>&1 &
          web_pid=$!
          status=0
          wait "$backend_pid" || status=1
          wait "$web_pid" || status=1
          for log in backend-build.log web-build.log; do
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done
          [ "$status" -eq 0 ]
          node -e 'const m=require("./backend-metadata.json"); const d=m["containerimage.digest"]; if (!/^sha256:[a-f0-9]{64}$/.test(d ?? "")) process.exit(1); process.stdout.write(d)' > backend.digest
          node -e 'const m=require("./web-metadata.json"); const d=m["containerimage.digest"]; if (!/^sha256:[a-f0-9]{64}$/.test(d ?? "")) process.exit(1); process.stdout.write(d)' > web.digest

      - name: Write immutable build-evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          config_sha="sha256:$(sha256sum deploy/cd/fixtures/isolated-config.env | awk '{print $1}')"
          migration_sha="$(node deploy/cd/migration-inventory.mjs)"
          backend_ref="${BACKEND_IMAGE}@$(cat backend.digest)"
          web_ref="${WEB_IMAGE}@$(cat web.digest)"
          node deploy/cd/release-manifest.mjs create \
            --kind build-evidence \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --architecture linux/amd64 \
            --configuration-sha256 "$config_sha" \
            --migration-inventory-sha256 "$migration_sha" \
            --fork-changelog apps/web/.fork-changelog/entries.json \
            --backend-image "$backend_ref" \
            --web-image "$web_ref" \
            --output cd-build-evidence.json
          node deploy/cd/release-manifest.mjs verify \
            --manifest cd-build-evidence.json \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-configuration-sha256 "$config_sha" \
            --expected-migration-inventory-sha256 "$migration_sha"
          docker buildx imagetools inspect "$backend_ref" | tee backend-inspect.txt
          docker buildx imagetools inspect "$web_ref" | tee web-inspect.txt
          entries_sha="$(node -p 'JSON.parse(require("node:fs").readFileSync("cd-build-evidence.json", "utf8")).fork_changelog_sha256')"
          cat > cd-image-provenance.json <<EOF
          {"fork_changelog_sha256":"${entries_sha}","images":{"backend":{"digest":"$(cat backend.digest)","architecture":"linux/amd64","repository":"${GITHUB_REPOSITORY}","source_sha":"${GITHUB_SHA}"},"web":{"digest":"$(cat web.digest)","architecture":"linux/amd64","repository":"${GITHUB_REPOSITORY}","source_sha":"${GITHUB_SHA}"}}}
          EOF

      - name: Upload D1 build evidence
        uses: actions/upload-artifact@v7
        with:
          name: cd-build-evidence-${{ github.sha }}
          path: |
            cd-build-evidence.json
            cd-image-provenance.json
            backend-metadata.json
            web-metadata.json
            backend-inspect.txt
            web-inspect.txt
          if-no-files-found: error
          retention-days: 30

      # Cache mounts count toward builder storage; keep it bounded so a runner's
      # dind volume cannot fill (BuildKit's default policy is relative to disk).
      - name: Bound the persistent builder cache
        if: ${{ always() }}
        timeout-minutes: 4
        run: docker buildx prune --builder "$BUILDER" --force --keep-storage 20GB
