name: CI
run-name: CHE-6149 off-host namespace qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  namespace-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 648fd398967d3366e9c52c29f19e1c0abd74836d
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '~1.27.3'
          cache: false
      - name: Require explicit namespace PASS on pinned source
        shell: bash
        working-directory: server
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = 648fd398967d3366e9c52c29f19e1c0abd74836d
          uname -a
          cat /proc/self/uid_map
          policy=kernel.apparmor_restrict_unprivileged_userns
          original=''
          restore_policy() {
            if [ -n "$original" ]; then
              sudo sysctl -w "$policy=$original"
              test "$(sysctl -n "$policy")" = "$original"
            fi
          }
          trap restore_policy EXIT
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            original=$(sysctl -n "$policy")
            sudo sysctl -w "$policy=0"
          fi
          unshare --user --map-root-user --pid --fork --mount-proc /bin/true
          go test -json -count=1 -timeout=60s ./pkg/runbinding -run '^TestBindingNestedNamespace$' | tee namespace-result.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          events = [json.loads(line) for line in Path('namespace-result.jsonl').read_text().splitlines()]
          test = 'TestBindingNestedNamespace'
          results = [e['Action'] for e in events if e.get('Test') == test and e['Action'] in ('pass', 'fail', 'skip')]
          if results != ['pass']:
              raise SystemExit(f'Qualification incomplete: {test} terminal results = {results!r}; explicit PASS required')
          print('QUALIFICATION PASS: TestBindingNestedNamespace on source 648fd398967d3366e9c52c29f19e1c0abd74836d (off-host only)')
          PY
