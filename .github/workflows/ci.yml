# CHE-920 INSTRUMENTATION BRANCH ONLY. Replaces CI so a workflow_dispatch run measures the two receipt tests on a
# GitHub-hosted runner (CHE-748 lane). Never merge or open a PR from this branch; the candidate is its parent commit.
name: CHE-920 quiet measurement

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: multica_test
          POSTGRES_USER: multica
          POSTGRES_PASSWORD: multica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multica -d multica_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://multica:multica@localhost:5432/multica_test?sslmode=disable
      GOFLAGS: -count=1
      OUT: che920-out
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Candidate identity (fail before measuring if it differs)
        run: |
          set -eu
          mkdir -p "$OUT"
          {
            echo "instrumentation_head=$(git rev-parse HEAD)"
            echo "candidate=$(git rev-parse HEAD^)"
            echo "changed_vs_candidate=$(git diff --name-only HEAD^ HEAD | tr '\n' ' ')"
            echo "server_tree=$(git rev-parse HEAD:server)"
            echo "test_blob=$(git rev-parse HEAD:server/internal/governance/receipt/receipt_budget_test.go)"
          } | tee "$OUT/identity.txt"
          test "$(git rev-parse HEAD^)" = afa315aac01090a7a038c14e5152a6dce21a0efa
          test "$(git rev-parse HEAD:server)" = 8c1bcccc236442eea9f0795668d30732a65e998a
          test "$(git diff --name-only HEAD^ HEAD | sort | tr '\n' ' ')" = ".github/che920/measure.sh .github/workflows/ci.yml "

      - name: Baseline sample before any build
        run: bash .github/che920/measure.sh baseline

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: false

      - name: Build test binaries and migrate
        run: |
          set -eu
          cd server
          mkdir -p "$RUNNER_TEMP/bin"
          go test -c -o "$RUNNER_TEMP/bin/n.norace.test" ./internal/governance/receipt
          go test -race -c -o "$RUNNER_TEMP/bin/n.race.test" ./internal/governance/receipt
          go run ./cmd/migrate up

      - name: Measure (400 fresh processes, 20 minute cap)
        run: BIN="$RUNNER_TEMP/bin" N=100 CAP=1200 bash .github/che920/measure.sh run

      - name: Upload raw output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: che920-quiet-measurement
          path: che920-out
          retention-days: 14
