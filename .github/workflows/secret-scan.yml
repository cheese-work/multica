# ci-policy: class=pr-validation
name: secret-scan

# CHE-2696. Scans the commits a PR or push adds with gitleaks (pinned, checksum-verified in scripts/secret-scan.sh).
# No token and no secrets; GitHub-hosted. Upstream-sync heads carry upstream history and are skipped.
# Making this check required in branch protection is Cheese's call.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    if: ${{ !startsWith(github.head_ref, 'upstream-sync/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the added commits
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ -n "$PR_BASE" ]]; then range="$PR_BASE..$PR_HEAD"
          elif [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then range="-1 $GITHUB_SHA"
          else range="$PUSH_BEFORE..$GITHUB_SHA"; fi
          bash scripts/secret-scan.sh "$range"
