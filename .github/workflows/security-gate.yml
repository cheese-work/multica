# ci-policy: class=gate
# Pre-merge security gate (CHE-2671), switched OFF by Cheese (CHE-5126, 10 Nov 2026; re-scan: CHE-5127; this change: CHE-5148).
#
# While the gate is off this workflow runs no verdict logic: its one step posts commit status `security-gate` = `success`
# with the description `security gate off (CHE-5126)`, so no PR or queue commit stays yellow.
# Switch the gate back on by reverting the CHE-5148 PR: the verdict logic and the comment trigger come back with it.
#
# Runs: `workflow_call` (pr-guards.yml, once per PR event), `workflow_dispatch` (input `pr`) and `merge_group`.
# No `issue_comment` trigger: a comment cannot change a status that is always `success`, and a skipped run still counts
# toward the daily run budget (CHE-4385).
# Nothing from a PR head is checked out or executed; the job holds no secret.

name: security-gate

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to mark green
        required: true
        type: string
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  security-gate:
    # Job name differs from the status context on purpose: the context is posted by the step, not by the job name.
    name: security-gate-eval
    # CHE-4251: once SECURITY_GATE_QUEUE_TRUSTED is true, security-gate-queue.yml posts the queue status and this job skips `merge_group`.
    if: github.event_name != 'merge_group' || vars.SECURITY_GATE_QUEUE_TRUSTED != 'true'
    # CHE-3604: GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
      GH_TOKEN: ${{ github.token }}
      MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
    steps:
      - name: Post security-gate success (gate off, CHE-5126)
        run: |
          set -euo pipefail
          sha="$MERGE_GROUP_SHA"
          if [ -z "$sha" ]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "pr must be digits only" >&2; exit 1; }
            sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state=success -f context=security-gate \
            -f "description=security gate off (CHE-5126)" \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # CHE-4251: a queue run that holds no secret. Its completion triggers security-gate-queue.yml, which runs from the
  # default branch. This definition comes from the queue commit, so it must never name an environment or a secret.
  queue-handoff:
    name: queue-handoff
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: echo "queue commit ${{ github.event.merge_group.head_sha }} handed to security-gate-queue"

  # CHE-4385: a verdict that lands after CI changes required-check evidence, so a dispatched run refreshes the receipt
  # in this same run (no `workflow_run` cascade, no separate run). While CI is still running its receipt is stale by
  # design: dispatch again once CI is done. Called only on `workflow_dispatch`; a PR push gets its receipt from pr-guards.
  mechanical-tier:
    needs: security-gate
    if: always() && github.event_name == 'workflow_dispatch' && needs.security-gate.result != 'skipped' && needs.security-gate.result != 'cancelled'
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    uses: ./.github/workflows/mechanical-tier.yml
