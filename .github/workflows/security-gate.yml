# Pre-merge security gate (CHE-2671). Copy of cheese-work/multica-dotfiles .github/workflows/security-gate.yml.
#
# Sets the `security-gate` commit status on the PR's exact head SHA. Register `security-gate` as a required status
# check only through the rollout in cheese-work/multica-dotfiles docs/cheese-work/SECURITY-GATE.md; this file alone blocks nothing.
#
# SECURITY — same boundary as mechanical-tier.yml: `pull_request_target` and `issue_comment` both run this
# definition from the default branch. The job checks out the DEFAULT branch (never the PR's base: a PR can target an
# unprotected branch that carries a modified gate script) and only FETCHES head objects for a diff read. Nothing from
# the head is executed. Do not add a head checkout or a secret here.
# `issue_comment` (created, edited, deleted) is the path by which a verdict comment flips or revokes the status; `edited`
# on the PR covers a retarget. The script re-reads the live head SHA and base ref.

name: security-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  # A comment the job skips (see `if:` below) gets its own group: a run cancels the in-flight run of its group before
  # its `if:` is read, so a skipped comment in the PR's group would cancel the real evaluation and post no status.
  # The skip test below repeats the `if:` condition; keep the two in step.
  group: security-gate-${{ github.event_name == 'issue_comment' && !(contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) || (github.event.comment.user.id == 282619718 && github.event.comment.user.type == 'Bot' && startsWith(github.event.comment.body, 'Security-Gate-Verdict:'))) && format('ignored-{0}', github.run_id) || github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  security-gate:
    # Job name differs from the status context on purpose: the context is posted by the script, not by this job.
    name: security-gate-eval
    # The X99 runner hook (job-started.sh) refuses a comment unless its author is OWNER, MEMBER or COLLABORATOR, or is the
    # trusted X99 agent App (ID 282619718, type Bot) posting a `Security-Gate-Verdict:` comment. That bot is NONE, so
    # filtering NONE alone would drop every verdict. Skip here exactly what the hook refuses: no job is scheduled and
    # no red check appears. The hook is a security boundary and stays as it is; this only mirrors it.
    if: >-
      github.event_name == 'pull_request_target' || (github.event.issue.pull_request &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
      (github.event.comment.user.id == 282619718 && github.event.comment.user.type == 'Bot' &&
      startsWith(github.event.comment.body, 'Security-Gate-Verdict:'))))
    runs-on: ${{ github.repository_owner == 'cheese-work' && fromJSON('["self-hosted","Linux","X64","cheese-x99"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Discard a reused workspace
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
      - name: Check out the protected default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the head objects without checking them out
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
      - name: Evaluate the verdict and post the status
        run: |
          python3 scripts/security-gate/security_gate.py --repo . --github "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" \
            --default-branch "$DEFAULT_BRANCH" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --post
