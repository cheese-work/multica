# Pre-merge security gate (CHE-2671). Copy of cheese-work/multica-dotfiles .github/workflows/security-gate.yml.
#
# Sets the `security-gate` commit status on the PR's exact head SHA. Register `security-gate` as a required status
# check only through the rollout in cheese-work/multica-dotfiles docs/cheese-work/SECURITY-GATE.md; this file alone blocks nothing.
#
# SECURITY — same boundary as mechanical-tier.yml: `pull_request_target` and `issue_comment` both run this
# definition from the default branch. The job checks out the DEFAULT branch (never the PR's base: a PR can target an
# unprotected branch that carries a modified gate script) and only FETCHES head objects for a diff read. Nothing from
# the head is executed (semgrep reads an extracted copy of the changed files; CHE-3121). Do not add a head checkout or a secret here.
# `issue_comment` (created, edited, deleted) is the path by which a verdict comment flips or revokes the status; `edited`
# on the PR covers a retarget. The script re-reads the live head SHA and base ref.
# `merge_group` posts the queued PR's freshly evaluated state on the queue commit; without it the required check never
# reports there and the queue times out. This file runs from the queue commit; the job still checks out the default
# branch and only fetches the queue ref. A verdict revoked after the queue commit went green is mirrored by the
# pull_request_target / issue_comment path: when the PR status is not `success`, the script (`revoke_queue`, CHE-3240)
# flips every queue head carrying that PR to `failure`, and fails a group it cannot read closed. If both queue lookups
# keep failing the job goes red and no head is flipped: dequeue the PR by hand. Each head's write is retried (3 attempts) and a head that still fails never skips the later heads; the job fails naming each unflipped head: dequeue it or re-run the job.

name: security-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  # A comment the job skips (see `if:` below) gets its own group: a run cancels the in-flight run of its group before
  # its `if:` is read, so a skipped comment in the PR's group would cancel the real evaluation and post no status.
  # The skip test below repeats the `if:` condition; keep the two in step.
  group: security-gate-${{ github.event_name == 'issue_comment' && !((contains(github.event.comment.body, 'Security-Gate-Verdict:') || (github.event.action == 'edited' && contains(github.event.changes.body.from, 'Security-Gate-Verdict:'))) && (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) || (github.event.comment.user.id == 282619718 && github.event.comment.user.type == 'Bot' && (startsWith(github.event.comment.body, 'Security-Gate-Verdict:') || (github.event.action == 'edited' && startsWith(github.event.changes.body.from, 'Security-Gate-Verdict:')))))) && format('ignored-{0}', github.run_id) || github.event.pull_request.number || github.event.issue.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  security-gate:
    # Job name differs from the status context on purpose: the context is posted by the script, not by this job.
    name: security-gate-eval
    # CHE-3354: a comment also needs the `Security-Gate-Verdict:` header, or an edit whose OLD body had it (`changes.body.from`),
    # so a plain comment queues nothing on the shared runner. An edit that drops the header is a revocation and still runs.
    # The X99 runner hook (job-started.sh) refuses a comment unless its author is OWNER, MEMBER or COLLABORATOR, or is the
    # trusted X99 agent App (ID 282619718, type Bot) posting a `Security-Gate-Verdict:` comment. That bot is NONE, so
    # filtering NONE alone would drop every verdict. Skip here exactly what the hook refuses: no job is scheduled and
    # no red check appears. The hook is a security boundary and stays as it is; this only mirrors it.
    # Revoking a PASS: edit it to a FAIL verdict, post a FAIL verdict, or delete it. Each event still carries the
    # prefix, so the hook admits it. An edit that removes the prefix is admitted for the bot only when the OLD body
    # (`changes.body.from`) had it (CHE-3354, hook updated to match); the next PR event re-reads every comment. `startsWith` here ignores case and the hook's `jq startswith` does not, so
    # a lowercase prefix from the bot schedules a job the hook then refuses: a red check, never a bypass.
    if: >-
      github.event_name == 'pull_request_target' || github.event_name == 'merge_group' || (github.event.issue.pull_request &&
      (contains(github.event.comment.body, 'Security-Gate-Verdict:') ||
      (github.event.action == 'edited' && contains(github.event.changes.body.from, 'Security-Gate-Verdict:'))) &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
      (github.event.comment.user.id == 282619718 && github.event.comment.user.type == 'Bot' &&
      (startsWith(github.event.comment.body, 'Security-Gate-Verdict:') ||
      (github.event.action == 'edited' && startsWith(github.event.changes.body.from, 'Security-Gate-Verdict:'))))))
    # CHE-3604: GitHub-hosted runner, so the X99 hook described above no longer applies; the `if:` above is the only comment filter.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # CHE-4251: only the queue run gets the c00-multicado App token (own API budget). The pull_request_target and
    # issue_comment runs also execute on `main`, which the environment's branch rule admits, so this expression is the
    # guard (tests/test_che4251_app_token.py): they run with no environment and no key.
    environment: ${{ github.event_name == 'merge_group' && 'ci-app-token' || '' }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
      MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
    steps:
      - name: Discard a reused workspace
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
      - name: Check out the protected default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the head objects without checking them out
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # A queue commit has the queued PR head as a parent, so fetching the queue ref brings the head objects too.
          src="refs/pull/${PR_NUMBER}/head"
          [ -n "$MERGE_GROUP_REF" ] && src="$MERGE_GROUP_REF"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags origin "+${src}:refs/remotes/pull/head"
      - name: Install pinned semgrep (cached on the runner)
        run: |
          venv="$RUNNER_TOOL_CACHE/semgrep-1.183.0"
          [ -x "$venv/bin/semgrep" ] || { python3 -m venv "$venv" && "$venv/bin/pip" install --quiet semgrep==1.183.0; }
          echo "SEMGREP_BIN=$venv/bin/semgrep" >> "$GITHUB_ENV"
      - name: Mint the c00-multicado read token (CHE-4251)
        id: app
        if: github.event_name == 'merge_group'
        # A missing key or environment must not stop a deploy: the pick step below falls back to GITHUB_TOKEN.
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.C00_MULTICADO_APP_ID }}
          private-key: ${{ secrets.C00_MULTICADO_CI_PRIVATE_KEY }}
          repositories: multica
          permission-metadata: read
          permission-contents: read
          permission-pull-requests: read
          permission-issues: read
          permission-statuses: write
      - name: Pick the API token (App token while its budget stays above 1,500)
        id: api
        if: github.event_name == 'merge_group'
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/cd/pick-api-token.sh
      - name: Evaluate the verdict and post the status
        env:
          GH_TOKEN: ${{ steps.api.outputs.token || github.token }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -z "$MERGE_GROUP_REF" ]; then
            exec python3 scripts/security-gate/security_gate.py --repo . --github "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" \
              --default-branch "$DEFAULT_BRANCH" --semgrep --run-url "$run_url" --post
          fi
          # Queue run. The default-branch script is used unchanged (it may predate this step), without --post: that
          # would write to the PR head. Its state goes on the queue commit, and only if the PR head is its parent.
          # CHE-4242: a 403/429 rate limit is waited out (5 s doubling to 60 s, 300 s in all) and then returns 75, which
          # the callers turn into `pending`; any other gh error keeps its exit code.
          gh_retry() {
            local out err waited=0 delay=5 rc
            err="$(mktemp)"
            while :; do
              out="$(gh "$@" 2>"$err")" && { printf '%s\n' "$out"; rm -f "$err"; return 0; }
              rc=$?
              grep -qiE 'rate limit|HTTP 429|too many requests' "$err" || { cat "$err" >&2; rm -f "$err"; return "$rc"; }
              if [ $((waited + delay)) -gt 300 ]; then cat "$err" >&2; rm -f "$err"; return 75; fi
              sleep "$delay"; waited=$((waited + delay)); delay=$((delay * 2 > 60 ? 60 : delay * 2))
            done
          }
          # A write that stays rate limited before any success is on the queue commit leaves no status: the entry stays
          # pending and the job gets a warning, not a red mark. A success already on the commit (published by this run or
          # an earlier one) or an unreadable earlier status keeps the job red, so a stale approval is never hidden.
          published_success=0
          earlier_not_success() {
            local s
            s="$(gh api "repos/$GITHUB_REPOSITORY/commits/$MERGE_GROUP_SHA/status" \
              --jq '[.statuses[] | select(.context == "security-gate") | .state][0] // "none"')" || return 1
            [ "$s" != success ]
          }
          post() {
            local rc=0
            gh_retry api "repos/$GITHUB_REPOSITORY/statuses/$MERGE_GROUP_SHA" -f "state=$1" -f context=security-gate \
              -f "description=${2:0:140}" -f "target_url=$run_url" >/dev/null || rc=$?
            if [ "$rc" = 0 ]; then
              if [ "$1" = success ]; then published_success=1; else published_success=0; fi
            elif [ "$rc" = 75 ] && [ "$published_success" = 0 ] && earlier_not_success; then
              echo "::warning::security-gate: rate limited, status not written; re-run this check" >&2
            else
              return "$rc"
            fi
          }
          re='^refs/heads/gh-readonly-queue/(.+)/pr-([0-9]+)-[0-9a-f]{40}$'
          if [[ ! $MERGE_GROUP_REF =~ $re ]] || [ "${BASH_REMATCH[1]}" != "$DEFAULT_BRANCH" ]; then
            post failure "unsupported merge group $MERGE_GROUP_REF: only $DEFAULT_BRANCH is gated"
            exit 0
          fi
          pr="${BASH_REMATCH[2]}"
          # Scan with semgrep once the default-branch script knows the flag; an older script would reject it.
          sg=""
          grep -q -e '--semgrep' scripts/security-gate/security_gate.py && sg="--semgrep"
          # Fresh verdict read -> head/state/desc; the PR head must be a parent of the queue commit. Every step returns
          # non-zero on error (no `set -e` inside an `if`), so the callers below can fail closed.
          evaluate() {
            local out parents
            out="$(python3 scripts/security-gate/security_gate.py --repo . --github "$GITHUB_REPOSITORY" --pr "$pr" \
              --default-branch "$DEFAULT_BRANCH" $sg --run-url "$run_url")" || return $?
            head="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["sha"])' "$out")" || return 1
            state="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["state"])' "$out")" || return 1
            desc="#$pr: $(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["description"])' "$out")" || return 1
            parents="$(gh_retry api "repos/$GITHUB_REPOSITORY/commits/$MERGE_GROUP_SHA" --jq '.parents[].sha')" || return $?
            if ! grep -qx "$head" <<<"$parents"; then
              state=failure desc="#$pr head ${head:0:12} is not a parent of ${MERGE_GROUP_SHA:0:12}"
            fi
          }
          # An unreadable verdict is a failure on the queue commit, never a stalled entry or a cached success. A rate
          # limit (exit 75) is no verdict at all: `pending`, so the queue entry waits for a re-run instead of ejecting.
          read_verdict() {
            local rc=0
            evaluate || rc=$?
            if [ "$rc" = 75 ]; then state=pending desc="#$pr: rate limited, retry"
            elif [ "$rc" != 0 ]; then state=failure desc="#$pr: cannot read the verdict"; fi
          }
          # A success is read again right before it is published and once more after (CHE-3240): a verdict revoked in
          # between is overwritten by the failure instead of the cached success. The revoke path (PR events) covers the rest.
          read_verdict
          if [ "$state" = success ]; then read_verdict; fi
          post "$state" "$desc"
          if [ "$state" = success ]; then
            read_verdict
            if [ "$state" != success ]; then post "$state" "$desc"; fi
          fi
