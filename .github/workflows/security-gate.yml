# Pre-merge security gate (CHE-2671). Copy of cheese-work/multica-dotfiles .github/workflows/security-gate.yml.
#
# Sets the `security-gate` commit status on the PR's exact head SHA. Register `security-gate` as a required status
# check only through the rollout in cheese-work/multica-dotfiles docs/cheese-work/SECURITY-GATE.md; this file alone blocks nothing.
#
# SECURITY — same boundary as mechanical-tier.yml: `pull_request_target` and `issue_comment` both run this
# definition from the default branch. The job checks out the DEFAULT branch (never the PR's base: a PR can target an
# unprotected branch that carries a modified gate script) and only FETCHES head objects for a diff read. Nothing from
# the head is executed. Do not add a head checkout or a secret here.
# `issue_comment` (created, edited, deleted) is the path by which a verdict comment flips or revokes the status; `edited`
# on the PR covers a retarget. The script re-reads the live head SHA and base ref.
# `merge_group` posts the queued PR's re-evaluated state on the queue commit; without it the required check never
# reports there and the queue times out. That event runs this file from the queue commit, whose PR head already
# passed this gate; the job still checks out the default branch and only fetches the queue commit.

name: security-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: security-gate-${{ github.event.pull_request.number || github.event.issue.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  security-gate:
    # Job name differs from the status context on purpose: the context is posted by the script, not by this job.
    name: security-gate-eval
    if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group' || github.event.issue.pull_request
    runs-on: ${{ github.repository_owner == 'cheese-work' && fromJSON('["self-hosted","Linux","X64","cheese-x99"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
      MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
    steps:
      - name: Discard a reused workspace
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
      - name: Check out the protected default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the head objects without checking them out
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # A queue commit has the queued PR head as a parent, so fetching it brings the head objects too.
          src="refs/pull/${PR_NUMBER}/head"
          [ -n "$MERGE_GROUP_REF" ] && src="$MERGE_GROUP_REF"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags origin "+${src}:refs/remotes/pull/head"
      # Runs the default-branch script unchanged, so the first queue run works before any script change has merged.
      # A queue commit gets the PR's re-evaluated state only while the PR head is its parent. Every event updates the
      # open queue commit(s) of the PR, so a revoked or replaced verdict cannot leave a queue commit green.
      - name: Evaluate the verdict and post the status
        run: |
          set -euo pipefail
          post() {
            gh api "repos/$GITHUB_REPOSITORY/statuses/$1" -f "state=$2" -f context=security-gate -f "description=${3:0:140}" \
              -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          }
          pr="$PR_NUMBER" queue="" flags=(--post)
          if [ -n "$MERGE_GROUP_REF" ]; then
            re='^refs/heads/gh-readonly-queue/(.+)/pr-([0-9]+)-[0-9a-f]{40}$'
            if [[ ! $MERGE_GROUP_REF =~ $re ]] || [ "${BASH_REMATCH[1]}" != "$DEFAULT_BRANCH" ]; then
              post "$MERGE_GROUP_SHA" failure "unsupported merge group $MERGE_GROUP_REF: only $DEFAULT_BRANCH is gated"
              exit 0
            fi
            pr="${BASH_REMATCH[2]}" queue="$MERGE_GROUP_SHA" flags=()  # --post would write to the PR head, not the queue commit
          fi
          out="$(python3 scripts/security-gate/security_gate.py --repo . --github "$GITHUB_REPOSITORY" --pr "$pr" \
            --default-branch "$DEFAULT_BRANCH" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "${flags[@]}")"
          [ -n "$queue" ] || queue="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/gh-readonly-queue/$DEFAULT_BRANCH/pr-$pr-" \
            --jq '.[].object.sha')"
          field() { python3 -c 'import json,sys; print(json.loads(sys.argv[1])[sys.argv[2]])' "$out" "$1"; }
          head="$(field sha)" state="$(field state)" desc="#$pr: $(field description)"
          for sha in $queue; do
            parents="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.parents[].sha')"  # not piped: grep -q + pipefail
            if grep -qx "$head" <<<"$parents"; then
              post "$sha" "$state" "$desc"
            else
              post "$sha" failure "#$pr head ${head:0:12} is not a parent of ${sha:0:12}"
            fi
          done
