name: Fork Sync Guard

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: fork-sync-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fork-sync-guard:
    name: Fork sync preservation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Fetch PR head as data without checking it out
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
      - name: Check fork source and test preservation
        run: node scripts/fork-sync-guard.mjs
