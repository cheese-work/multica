name: Desktop Smoke Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Windows leg removed org-wide per CHE-522 (Cheese: Linux CI only, no
  # Windows jobs or artifacts).
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub-hosted (CHE-748): free on this public repo, no Blacksmith,
          # no X99-only dependency — plain checkout + electron-builder package.
          - os: ubuntu-24.04
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install rpmbuild (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # Keep the security floor even when the setup-go manifest lags;
          # continue accepting newer patches within Go 1.27.
          go-version: "~1.27.3"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        run: bash scripts/setup-pnpm.sh

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Desktop installers (${{ matrix.target }})
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/package.mjs --${{ matrix.target }} --x64 --arm64 --publish never

      - name: Upload Desktop artifacts (${{ matrix.target }})
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: apps/desktop/dist
          if-no-files-found: error
