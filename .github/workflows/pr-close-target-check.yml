name: PR Close Target Check

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-close-target-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  close-target:
    if: github.event.pull_request.state != 'closed'
    runs-on: [self-hosted, Linux, X64, cheese-x99]
    timeout-minutes: 5
    steps:
      - name: Clear stale sparse-checkout state
        # X99 runner workspaces are reused. A narrow checkout leaves
        # core.sparseCheckout=true in .git/config, which actions/checkout's
        # sparse disable then hides (CHE-1676). Reset it before checking out.
        run: |
          [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          g() { git -c safe.directory="$GITHUB_WORKSPACE" "$@"; }
          g config --local --unset-all core.sparseCheckout || true
          g config --local --unset-all core.sparseCheckoutCone || true
          g config --local --unset-all extensions.worktreeConfig || true
          rm -f .git/info/sparse-checkout .git/config.worktree
          g read-tree -mu HEAD || true
      - name: Checkout trusted workflow checker
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts/pr-close-target-check.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate intended issue close target
        run: node scripts/pr-close-target-check.mjs --event "$GITHUB_EVENT_PATH"
      - name: Clear stale sparse-checkout state
        if: always()
        # X99 runner workspaces are reused. A narrow checkout leaves
        # core.sparseCheckout=true in .git/config, which actions/checkout's
        # sparse disable then hides (CHE-1676). Reset it before checking out.
        run: |
          [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          g() { git -c safe.directory="$GITHUB_WORKSPACE" "$@"; }
          g config --local --unset-all core.sparseCheckout || true
          g config --local --unset-all core.sparseCheckoutCone || true
          g config --local --unset-all extensions.worktreeConfig || true
          rm -f .git/info/sparse-checkout .git/config.worktree
          g read-tree -mu HEAD || true
