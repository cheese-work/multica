name: PR Close Target Check

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-close-target-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  close-target:
    if: github.event.pull_request.state != 'closed'
    # Hosted, not X99: edited events fire on every title/body change and queued
    # up to 46 min behind other X99 jobs (CHE-2415). Trusted checker only, no PR code.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted workflow checker
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate intended issue close target
        run: node scripts/pr-close-target-check.mjs --event "$GITHUB_EVENT_PATH"
