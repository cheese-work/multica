# ci-policy: class=deploy
name: CD deploy to C00
run-name: CD deploy to C00 · ${{ inputs.candidate_sha || inputs.ref || github.event_name }}

# D2 (CHE-530 / CHE-1923): deploys an already-admitted release-candidate tuple
# to the live C00 self-host stack on the target-host local runner
# ([self-hosted, linux, x64, cheese-c00-deploy]). This workflow is the ONLY
# place in the repo that holds C00 host paths and pull credentials — D1's
# cd-qualification.yml is read-only and deliberately carries none of them
# (see the comment at the top of that file and deploy/cd/README.md).
#
# CHE-5182: the automatic deploy runs on a schedule, every 4 hours (00:17, 04:17,
# 08:17, 12:17, 16:17, 20:17 ICT), not after every qualified build. The first
# job, schedule-resolve, picks the newest main commit whose cd-qualification run
# succeeded and ends the run with "nothing new to deploy" when C00 already runs
# it. It uses no C00 runner, lock or environment.
#
# CHE-4495 / CHE-4582: the owner's merge to `main` is the deploy authorization.
# For the scheduled candidate, authorize-c00 reads who merged the
# pull request behind that commit. The owner (`congvc-dev`) or a login in the
# C00_DEPLOY_AUTHORIZERS repository variable (CHE-3123 adds the agent merge
# identity there, no workflow change) deploys automatically once
# candidate-preflight finds the commit eligible. A merge by anyone else builds
# and stops with the one-click notice. A `workflow_dispatch` still needs an
# allowed actor, checked by authorize-c00 before any C00 step. GitHub's
# required-reviewer environments do not gate on a private Team repo, so the
# gate is the merger/actor check plus the main-only deployment-branch policy of
# c00-runtime (secrets exist only on `main`).
#
# CHE-2365, CHE-5175: after a deploy, C00 is watched for 15 minutes without
# holding a runner. `readback` waits at most 90 seconds for health, arms the
# native C00 health observer (a systemd timer that samples the route every 10 s
# into a durable journal, installed by deploy/cd/install-health-observer.sh) and
# waits for its first timer sample, then checks the SHA and the image digests and
# records T0. `readback-delay` is the c00-readback-delay environment's 15-minute
# wait timer; a waiting job holds no runner. `readback-confirm` then spends about
# 10 seconds on the C00 runner and verifies the journal (one healthy sample for
# every slot, none failed or missing), `docker events` since T0 and the restart
# count. A failed
# deploy, readback, readback-delay or readback-confirm suspends automatic deploys: the next
# authorize-c00 finds the latest finished run failed and builds without
# deploying, until a later deploy succeeds (the owner's dispatch lifts it).
# The cutover controller rolls back by digest on a failed cutover, and the
# `rollback` job does the same after a failed readback, readback-delay or readback-confirm.
#
# CHE-5353: when GitHub drops a schedule slot, the freshness alarm dispatches this
# workflow with `schedule_backup=true`. That run takes the scheduled path above
# (resolve, preflight, merger and suspension checks), not the manual one, and
# authorize-c00 accepts the marker only from github-actions[bot].
#
# A dispatch with `candidate_sha` needs one job a manual-evidence dispatch does
# not: prepare-release-candidate. D1 publishes a `build-evidence` manifest, and
# admission.mjs REFUSES build-evidence for deployment — a deployable
# `release-candidate` manifest additionally binds the baseline tuple of the
# host being deployed to, which only a stage running on C00 can read. That
# job reads the live baseline locally on the C00 self-hosted runner,
# re-issues D1's evidence as a release-candidate bound to it, and hands
# the result to the unchanged admission and deploy jobs. admission.mjs is not
# weakened to make this fit: it still verifies the manifest, the event, the
# provenance digests and the required checks, and still refuses
# build-evidence.
on:
  schedule:
    # 00:17, 04:17, 08:17, 12:17, 16:17, 20:17 ICT (UTC+7), off the hour: GitHub drops top-of-hour schedules under load.
    - cron: "17 1,5,9,13,17,21 * * *"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Full SHA of a qualified main commit to deploy; leave empty (with the paths below empty too) to deploy the newest qualified main commit"
        required: false
      manifest_path:
        description: "Path (relative to repo root, at the checked-out ref) to the release-candidate manifest JSON"
        required: false
      baseline_tuple_path:
        description: "Path to the C00 tuple snapshot the manifest was qualified against"
        required: false
      event_path:
        description: "Path to the recorded {event_name, ref, repository, sha} JSON for the qualifying push"
        required: false
      checks_path:
        description: "Path to the recorded {sha, contexts} required-checks JSON"
        required: false
      provenance_path:
        description: "Path to the recorded image provenance JSON (backend/web digest + architecture + repository + source_sha)"
        required: false
      schedule_backup:
        description: "Set only by the C00 deploy freshness alarm (CHE-5353) when a schedule slot was dropped: runs the scheduled path (resolve, preflight, merger and suspension checks) instead of the manual one; authorize-c00 refuses any sender but the workflow robot"
        required: false
      ref:
        description: "Git ref to check out (must match the manifest's source_sha)"
        required: true
        default: main

# This workflow deliberately has no build step and never touches the
# registry beyond a pull performed on C00 itself by the local C00 runner —
# it only reads already-published, already-admitted evidence and mutates C00.
permissions:
  contents: read
  actions: read

# No workflow-level concurrency (CHE-2027): a queued run would hold it and block
# every newer version behind it. The two jobs that touch C00
# (prepare-release-candidate, deploy) share one never-cancelled lock group.
#
# The lock uses `queue: max`. The default (`single`) keeps ONE pending job and
# cancels it for any newcomer, whatever its version, so a stale stage joining
# late would evict the newest candidate; a freshness check made before the join
# cannot close that gap, since check and join are not atomic. `max` queues up
# to 100 pending jobs FIFO and evicts none. `cancel-in-progress` stays off (the default): it
# cannot be combined with `queue`, and a started deploy must never be cancelled.
jobs:
  # CHE-5182: scheduled runs only. Ends here with an empty `sha` when there is
  # nothing new to deploy, so no later job starts. No environment, no secrets and
  # no concurrency group: it never queues behind a deploy.
  schedule-resolve:
    if: (github.event_name == 'schedule' || inputs.schedule_backup != '')
    runs-on: [self-hosted, linux, x64, cheese-x99]
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      notice: ${{ steps.resolve.outputs.notice }}
    steps:
      - name: Checkout the workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve the newest qualified commit C00 does not run yet
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          C00_CONFIG_URL: ${{ vars.C00_CONFIG_URL }}
        run: bash deploy/cd/resolve-scheduled.sh

  # ---------------------------------------------------------------------------
  # The deploy gate (CHE-4495, CHE-4582). Runs for a dispatch and for a
  # scheduled candidate. deploy/cd/authorize-c00.py fails a dispatch by an
  # actor outside the allowlist, so every C00 job behind it never starts. For a
  # scheduled candidate it answers `authorized=false` (no error) unless the merger of
  # the commit's pull request is on the allowlist and no earlier automatic
  # deploy failed. It has no environment and no secrets. The script comes from
  # the workflow revision itself (no `ref`), never from a pull request.
  # ---------------------------------------------------------------------------
  authorize-c00:
    needs: schedule-resolve
    if: always() && ((github.event_name == 'workflow_dispatch' && inputs.schedule_backup == '') || ((github.event_name == 'schedule' || inputs.schedule_backup != '') && needs.schedule-resolve.outputs.sha != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      candidate_sha: ${{ steps.gate.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: deploy/cd/authorize-c00.py
      - name: Who may deploy to C00
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ needs.schedule-resolve.outputs.sha }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          INPUT_SCHEDULE_BACKUP: ${{ inputs.schedule_backup }}
          EXTRA_AUTHORIZERS: ${{ vars.C00_DEPLOY_AUTHORIZERS }}
        run: python3 deploy/cd/authorize-c00.py

  # CHE-2418 B5: tells the owner a qualified candidate is ready and links the
  # dispatch page. Nothing needs this job, so a dead route never holds a deploy.
  # A configured route that delivers nothing fails it (CHE-4879); no route
  # configured only warns. It runs on X99, which can
  # reach the tailnet-only Multica server.
  notify-approval:
    needs: [schedule-resolve, candidate-preflight, authorize-c00]
    if: always() && (github.event_name == 'schedule' || inputs.schedule_backup != '') && needs.candidate-preflight.outputs.eligible == 'true' && needs.authorize-c00.outputs.authorized != 'true'
    runs-on: [self-hosted, linux, x64, cheese-x99]
    timeout-minutes: 2
    # One notice at a time, so two candidates cannot both read "no open ask" and
    # post. The script also checks freshness at the write.
    concurrency:
      group: c00-approval-notice
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: deploy/cd/notify-approval.sh
      - name: Notify owner
        env:
          HEAD_SHA: ${{ needs.schedule-resolve.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/cd-deploy.yml
          RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          # Only the token is a secret. The other values are public defaults; a secret of the same name overrides them.
          WEBHOOK_URL: ${{ secrets.C00_APPROVAL_WEBHOOK_URL }}
          MULTICA_SERVER_URL: ${{ secrets.C00_APPROVAL_MULTICA_SERVER_URL || 'https://congvc-c00.taila6fa8a.ts.net:19444' }}
          MULTICA_TOKEN: ${{ secrets.C00_APPROVAL_MULTICA_TOKEN }}
          MULTICA_WORKSPACE_ID: ${{ secrets.C00_APPROVAL_MULTICA_WORKSPACE_ID || 'f2b734e0-b6de-4414-8a27-a2f69b0ef843' }}
          MULTICA_NOTIFY_ISSUE: ${{ secrets.C00_APPROVAL_MULTICA_ISSUE || '01a1bff0-6ccc-7873-9ac8-580037bc5206' }}
          MULTICA_NOTIFY_MEMBER_ID: ${{ secrets.C00_APPROVAL_MULTICA_MEMBER_ID || 'f0c4c4cf-b6cd-4939-bfba-a5e14290c1ff' }}
          MULTICA_NOTIFY_SOURCE_COMMENT: ${{ secrets.C00_APPROVAL_MULTICA_SOURCE_COMMENT || '01a1bff1-cdf8-7856-ad05-da57f3a396f2' }}
        run: |
          SOURCE_SHA="$HEAD_SHA" bash deploy/cd/notify-approval.sh

  candidate-preflight:
    needs: schedule-resolve
    # CHE-4500 (CHE-3625 item 2): while main is red the cron sets the repo variable MAIN_RED_PAUSED (an unset
    # variable reads as ''). A skipped preflight leaves `eligible` empty, so notice, prepare, admission and
    # deploy are skipped. Nothing needs a rerun: the next 4-hour schedule slot re-evaluates the variable.
    # The manual workflow_dispatch path is a deliberate human act and is not paused. A schedule_backup dispatch takes the scheduled path and is paused.
    if: always() && (github.event_name == 'schedule' || inputs.schedule_backup != '') && needs.schedule-resolve.outputs.sha != '' && vars.MAIN_RED_PAUSED == ''
    runs-on: [self-hosted, linux, x64, cheese-x99]
    timeout-minutes: 65
    # CHE-4251: own API budget for the read path; main-only environment holding the c00-multicado CI key.
    environment: ci-app-token
    outputs:
      eligible: ${{ steps.candidate.outputs.eligible }}
    steps:
      - name: Checkout the workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Use disposable build caches
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/build-cache-env.sh"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install the YAML parser the path-filter reader needs
        shell: bash
        run: bash deploy/cd/ensure-pyyaml.sh

      - name: Mint the c00-multicado read token (CHE-4251)
        id: app
        # A missing key or environment must not stop a deploy: the pick step below falls back to GITHUB_TOKEN.
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.C00_MULTICADO_APP_ID }}
          private-key: ${{ secrets.C00_MULTICADO_CI_PRIVATE_KEY }}
          repositories: multica
          permission-metadata: read
          permission-contents: read
          permission-actions: read
          permission-checks: read
          permission-statuses: read
          permission-pull-requests: read
      - name: Pick the API token (App token while its budget stays above 1,500)
        id: api
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/cd/pick-api-token.sh

      - name: Select a forward candidate before C00 approval
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ steps.api.outputs.token }}
          # The scripts re-read the App budget before every API phase and drop to FALLBACK_TOKEN below the reserve.
          APP_TOKEN: ${{ steps.app.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.schedule-resolve.outputs.sha }}
          C00_CONFIG_URL: ${{ vars.C00_CONFIG_URL }}
          CHECKS_WAIT_SECONDS: "3600"
        run: bash deploy/cd/candidate-preflight.sh "$SOURCE_SHA" cd-checks.json

  # CHE-4998: an empty dispatch (no candidate_sha, no evidence path) deploys the
  # newest qualified main commit. Resolved after the actor check; a typed SHA or
  # an evidence-path dispatch passes through (see deploy/cd/resolve-candidate.sh).
  # CHE-4582: an authorized scheduled candidate passes its own SHA through the
  # same step, so every job behind it reads one `sha` output.
  resolve-candidate:
    needs: authorize-c00
    if: always() && needs.authorize-c00.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      notice: ${{ steps.resolve.outputs.notice }}
    steps:
      - name: Checkout the workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Resolve the candidate commit
        id: resolve
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.authorize-c00.outputs.candidate_sha }}
          INPUT_MANIFEST: ${{ inputs.manifest_path }}
          INPUT_BASELINE: ${{ inputs.baseline_tuple_path }}
          INPUT_EVENT: ${{ inputs.event_path }}
          INPUT_CHECKS: ${{ inputs.checks_path }}
          INPUT_PROVENANCE: ${{ inputs.provenance_path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/cd/resolve-candidate.sh

  # CHE-5352: one line on CHE-4960 when an empty dispatch resolves to a candidate
  # far behind main. Posts from X99, which can reach the tailnet-only Multica
  # server; the token is a secret, and without it the job only warns. Nothing
  # waits on this job.
  notify-stale-candidate:
    needs: resolve-candidate
    if: always() && needs.resolve-candidate.outputs.notice != ''
    runs-on: [self-hosted, linux, x64, cheese-x99]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: deploy/cd/post-stale-notice.sh
      - name: Post the notice
        env:
          NOTICE: ${{ needs.resolve-candidate.outputs.notice }}
          MULTICA_SERVER_URL: ${{ secrets.C00_APPROVAL_MULTICA_SERVER_URL || 'https://congvc-c00.taila6fa8a.ts.net:19444' }}
          MULTICA_TOKEN: ${{ secrets.CD_NOTICE_MULTICA_TOKEN }}
          MULTICA_WORKSPACE_ID: ${{ secrets.C00_APPROVAL_MULTICA_WORKSPACE_ID || 'f2b734e0-b6de-4414-8a27-a2f69b0ef843' }}
          MULTICA_NOTICE_ISSUE_ID: 01a1c0cd-8ffe-7dfa-8609-19bc0c467daa
        run: bash deploy/cd/post-stale-notice.sh

  # ---------------------------------------------------------------------------
  # Dispatch with candidate_sha only. Turns D1's build-evidence into a deployable
  # release-candidate by binding it to C00's CURRENT baseline tuple.
  #
  # This job runs directly on the C00 self-hosted runner
  # ([self-hosted, linux, x64, cheese-c00-deploy]) under the
  # c00-runtime environment to read that baseline locally. The dispatch
  # was authorized at authorize-c00. It reads and writes nothing on C00
  # beyond a temp file it removes: capture-tuple.sh inspects containers
  # and runs one SELECT.
  # ---------------------------------------------------------------------------
  prepare-release-candidate:
    needs: [authorize-c00, candidate-preflight, resolve-candidate]
    # A dispatch names its candidate; an authorized merge needs the eligible preflight first.
    if: always() && needs.authorize-c00.outputs.authorized == 'true' && needs.resolve-candidate.result == 'success' && needs.resolve-candidate.outputs.sha != '' && ((github.event_name == 'workflow_dispatch' && inputs.schedule_backup == '') || needs.candidate-preflight.outputs.eligible == 'true')
    runs-on: [self-hosted, linux, x64, cheese-c00-deploy]
    concurrency:
      group: cd-deploy-c00
      queue: max
    # Up to 60 minutes waiting for CI's required checks plus the original
    # 15-minute budget for the baseline read and evidence issue.
    timeout-minutes: 80
    environment: c00-runtime
    outputs:
      source_sha: ${{ steps.evidence.outputs.source_sha }}
    steps:
      # The dispatcher names the commit; the qualification run for it is looked
      # up, never taken from input. Only a successful `main` push run counts.
      - name: Resolve the qualification run for the candidate
        id: q
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::candidate_sha must be a full 40-hex commit SHA" >&2; exit 1; }
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "CD qualification build" \
            --commit "$CANDIDATE_SHA" --branch main --event push --status success \
            --json databaseId --jq '.[0].databaseId // empty')"
          [ -n "$run_id" ] || { echo "::error::no successful main qualification run for $CANDIDATE_SHA" >&2; exit 1; }
          { echo "sha=$CANDIDATE_SHA"; echo "run_id=$run_id"; echo "event=push"; echo "branch=main"; } >> "$GITHUB_OUTPUT"

      - name: Checkout the qualified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.q.outputs.sha }}
          # Full history, not a shallow clone: the baseline step resolves the
          # short image tag C00 is currently running into a full commit SHA
          # with `git rev-parse`, and a depth-1 checkout contains only the
          # qualified commit itself — every older deployed tag would fail to
          # resolve.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      # Before anything reads C00: CI's required checks finish well after
      # this workflow is triggered, and the baseline read below should be as
      # fresh as possible when the evidence set is issued.
      - name: Install the YAML parser the path-filter reader needs
        shell: bash
        run: bash deploy/cd/ensure-pyyaml.sh

      - name: Record the required-check results for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.q.outputs.sha }}
          CHECKS_WAIT_SECONDS: "3600"
        # Waits for pending required checks, then snapshots them; see the
        # script header. Admission still decides; this only records.
        run: bash deploy/cd/record-checks.sh "$SOURCE_SHA" cd-checks.json

      - name: Download D1 build evidence
        uses: actions/download-artifact@v8
        with:
          name: cd-build-evidence-${{ steps.q.outputs.sha }}
          path: d1-evidence
          run-id: ${{ steps.q.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read C00's current baseline tuple
        env:
          C00_COMPOSE_DIR: ${{ secrets.C00_COMPOSE_DIR }}
          C00_STATE_DIR: ${{ secrets.C00_STATE_DIR }}
          C00_CUTOVER_STATE_DIR: ${{ secrets.C00_CUTOVER_STATE_DIR }}
        shell: bash
        run: bash deploy/cd/capture-remote-baseline.sh baseline-tuple.json

      - name: Issue the release-candidate manifest
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${{ steps.q.outputs.sha }}"

          # The release-candidate carries D1's own digests unchanged — this
          # stage re-binds evidence, it never re-qualifies an image. Reading
          # them back out of D1's manifest (rather than accepting them as
          # inputs) is what keeps "the exact pair D1 qualified" true by
          # construction for acceptance item 2.
          read_field() {
            node -e 'const m=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(String(process.argv[2].split(".").reduce((a,k)=>a?.[k],m)))' \
              d1-evidence/cd-build-evidence.json "$1"
          }
          d1_source_sha="$(read_field source_sha)"
          if [ "$d1_source_sha" != "$source_sha" ]; then
            echo "::error::D1 evidence is for $d1_source_sha but this run qualified $source_sha"
            exit 1
          fi

          node deploy/cd/release-manifest.mjs create \
            --kind release-candidate \
            --repository "$(read_field repository)" \
            --source-sha "$source_sha" \
            --architecture "$(read_field architecture)" \
            --configuration-sha256 "$(read_field configuration_sha256)" \
            --migration-inventory-sha256 "$(read_field migration_inventory_sha256)" \
            --backend-image "$(read_field images.backend)" \
            --web-image "$(read_field images.web)" \
            --baseline-tuple-sha256 "$(node deploy/cd/tuple-snapshot.mjs digest --snapshot baseline-tuple.json)" \
            --output cd-release-candidate.json

          # admission.mjs checks the qualifying event and the required check
          # contexts. Record both from the API rather than asserting them:
          # the event comes from the qualification run looked up above, the checks from the commit's own check runs.
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync("cd-event.json", `${JSON.stringify({
              event_name: process.env.RUN_EVENT,
              ref: `refs/heads/${process.env.RUN_BRANCH}`,
              repository: process.env.GITHUB_REPOSITORY,
              sha: process.env.SOURCE_SHA,
            }, null, 2)}\n`);
          '
          cp d1-evidence/cd-image-provenance.json cd-provenance.json
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
        env:
          RUN_EVENT: ${{ steps.q.outputs.event }}
          RUN_BRANCH: ${{ steps.q.outputs.branch }}
          SOURCE_SHA: ${{ steps.q.outputs.sha }}

      - name: Upload the release-candidate evidence set
        uses: actions/upload-artifact@v7
        with:
          name: cd-release-candidate-${{ steps.q.outputs.sha }}
          path: |
            cd-release-candidate.json
            baseline-tuple.json
            cd-event.json
            cd-checks.json
            cd-provenance.json
          retention-days: 30
          if-no-files-found: error

  admission:
    # Admission is a read-only evidence check — it never touches C00 — so it
    # can run on a regular GitHub-hosted runner. Only the deploy job below
    # needs the dedicated C00-reachable runner and secrets.
    needs: [authorize-c00, resolve-candidate, prepare-release-candidate]
    # A dispatch with evidence paths skips prepare-release-candidate entirely
    # (its caller supplies an already-issued manifest), so this must not be
    # skipped just because that job did not run. Nothing runs without the gate.
    if: always() && needs.authorize-c00.outputs.authorized == 'true' && needs.resolve-candidate.result == 'success' && (needs.resolve-candidate.outputs.sha == '' || needs.prepare-release-candidate.result == 'success')
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.verify_admission.outputs.source_sha }}
      ref: ${{ steps.paths.outputs.ref }}
      manifest_path: ${{ steps.paths.outputs.manifest_path }}
      baseline_tuple_path: ${{ steps.paths.outputs.baseline_tuple_path }}
    steps:
      - name: Resolve the evidence set for this trigger
        id: paths
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.sha }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_MANIFEST: ${{ inputs.manifest_path }}
          INPUT_BASELINE: ${{ inputs.baseline_tuple_path }}
          INPUT_EVENT: ${{ inputs.event_path }}
          INPUT_CHECKS: ${{ inputs.checks_path }}
          INPUT_PROVENANCE: ${{ inputs.provenance_path }}
        run: |
          set -euo pipefail
          if [ -n "$CANDIDATE_SHA" ]; then
            {
              echo "ref=$CANDIDATE_SHA"
              echo "manifest_path=cd-evidence/cd-release-candidate.json"
              echo "baseline_tuple_path=cd-evidence/baseline-tuple.json"
              echo "event_path=cd-evidence/cd-event.json"
              echo "checks_path=cd-evidence/cd-checks.json"
              echo "provenance_path=cd-evidence/cd-provenance.json"
            } >> "$GITHUB_OUTPUT"
          else
            for v in INPUT_MANIFEST INPUT_BASELINE INPUT_EVENT INPUT_CHECKS INPUT_PROVENANCE; do
              [ -n "${!v}" ] || { echo "::error::set candidate_sha, or every evidence path ($v is empty)" >&2; exit 1; }
            done
            {
              echo "ref=$INPUT_REF"
              echo "manifest_path=$INPUT_MANIFEST"
              echo "baseline_tuple_path=$INPUT_BASELINE"
              echo "event_path=$INPUT_EVENT"
              echo "checks_path=$INPUT_CHECKS"
              echo "provenance_path=$INPUT_PROVENANCE"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.paths.outputs.ref }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Download the prepared evidence set
        if: needs.resolve-candidate.outputs.sha != ''
        uses: actions/download-artifact@v8
        with:
          name: cd-release-candidate-${{ needs.resolve-candidate.outputs.sha }}
          path: cd-evidence

      - name: Verify admission
        id: verify_admission
        shell: bash
        env:
          MANIFEST_PATH: ${{ steps.paths.outputs.manifest_path }}
          BASELINE_TUPLE_PATH: ${{ steps.paths.outputs.baseline_tuple_path }}
          EVENT_PATH: ${{ steps.paths.outputs.event_path }}
          CHECKS_PATH: ${{ steps.paths.outputs.checks_path }}
          PROVENANCE_PATH: ${{ steps.paths.outputs.provenance_path }}
        run: |
          set -euo pipefail
          config_sha="$(node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(m.configuration_sha256)' "$MANIFEST_PATH")"
          migration_sha="$(node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(m.migration_inventory_sha256)' "$MANIFEST_PATH")"
          source_sha="$(node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(m.source_sha)' "$MANIFEST_PATH")"
          node deploy/cd/admission.mjs verify \
            --manifest "$MANIFEST_PATH" \
            --baseline-tuple "$BASELINE_TUPLE_PATH" \
            --event "$EVENT_PATH" \
            --checks "$CHECKS_PATH" \
            --provenance "$PROVENANCE_PATH" \
            --repository "${{ github.repository }}" \
            --source-sha "$source_sha" \
            --configuration-sha256 "$config_sha" \
            --migration-inventory-sha256 "$migration_sha"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Stage exact cutover input layout
        shell: bash
        env:
          MANIFEST_PATH: ${{ steps.paths.outputs.manifest_path }}
          BASELINE_TUPLE_PATH: ${{ steps.paths.outputs.baseline_tuple_path }}
        run: |
          set -euo pipefail
          mkdir -p cutover-input
          cp "$MANIFEST_PATH" cutover-input/manifest.json
          cp "$BASELINE_TUPLE_PATH" cutover-input/baseline-tuple.json

      - name: Upload exact cutover input layout
        uses: actions/upload-artifact@v7
        with:
          name: cd-deploy-admitted-input
          path: cutover-input
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: admission
    # always(): on a manual dispatch candidate-preflight is skipped, and the
    # implicit success() is false when any job up the needs chain was skipped,
    # so deploy, readback and rollback never ran (CHE-5147). The explicit
    # admission result keeps the gate: admission itself needs the
    # authorize-c00 actor check.
    if: always() && needs.admission.result == 'success'
    # Reserved for the C00-reachable deploy runner, distinct from D1's
    # cheese-x99 build runner label. See multica-cheese-work-runtimes for the
    # current host/runner-label mapping; this label is a placeholder for
    # whichever self-hosted runner has network access to C00.
    runs-on: [self-hosted, linux, x64, cheese-c00-deploy]
    timeout-minutes: 30
    environment: c00-runtime
    # A job-level block replaces the workflow-level one, so contents and
    # actions are repeated. packages: read lets the job's own token pull the
    # private images; only this job gets it.
    permissions:
      contents: read
      actions: read
      packages: read
    # Shared with prepare-release-candidate: one C00 stage at a time, queued
    # FIFO. Never cancelled and never evicted, so a newer version can neither
    # interrupt a deploy that has started nor displace a queued newer one.
    concurrency:
      group: cd-deploy-c00
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.admission.outputs.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Download exact cutover input layout
        uses: actions/download-artifact@v8
        with:
          name: cd-deploy-admitted-input
          path: cutover-input

      - name: Deploy to C00 on local runner
        id: deploy
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.admission.outputs.source_sha }}
          # The only C00 deployment inputs in this repository. Scoped to this
          # workflow/job only — cd-qualification.yml (D1) has none of these
          # and must stay that way (see its own header comment).
          C00_COMPOSE_DIR: ${{ secrets.C00_COMPOSE_DIR }}
          C00_STATE_DIR: ${{ secrets.C00_STATE_DIR }}
          C00_CUTOVER_STATE_DIR: ${{ secrets.C00_CUTOVER_STATE_DIR }}
          # Deployment tuple state, A/B cutover state, and the router's own
          # state directory are three separate durable roots on C00 (CHE-701
          # already split cutover state out of C00_STATE_DIR for the same
          # reason). `deploy/cd/router/docker-compose.router.yml` bind-mounts
          # its state directory from wherever the router container was first
          # adopted on the host -- a one-time, host-side choice that is NOT
          # guaranteed to sit under C00_COMPOSE_DIR. Deriving
          # "$C00_COMPOSE_DIR/deploy/cd/router/state" silently pointed at a
          # path with no active.json (CD run 36083685740, CHE-768): the
          # router's real state lives at ${HOME}/.multica/ab/deploy/cd/router/state
          # on C00, a different tree entirely. This must be its own secret,
          # not a guess. It MUST be the absolute path (no leading ~): the
          # value is passed through render-cutover-remote-script.sh's
          # `printf '%q'`, which escapes a leading ~ into a literal
          # character instead of letting the shell expand it to
          # C00's home directory (CHE-768 review) -- provision the secret
          # as the real absolute path, not the shorthand this comment used
          # before.
          C00_ROUTER_STATE_DIR: ${{ secrets.C00_ROUTER_STATE_DIR }}
          # This job's own token, read-only for packages (CHE-549, CHE-2027):
          # C00 has no ambient registry credential, so deploy.sh logs in to
          # ghcr.io with this immediately before its pull step and logs out
          # unconditionally afterwards (see deploy.sh's own comment). It
          # expires with the job, so no personal access token is stored. The
          # package must grant this repository read access (Manage Actions
          # access). Forwarded to the cutover shell as an exported var, never
          # interpolated into the command line, so it never appears in a
          # process listing or shell history on C00.
          GHCR_PULL_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest_path="cutover-input/manifest.json"
          baseline_path="cutover-input/baseline-tuple.json"
          test -f "$manifest_path"
          test -f "$baseline_path"
          # C00_ROUTER_STATE_DIR is passed through
          # render-cutover-remote-script.sh's printf '%q', which escapes a
          # leading ~ into a literal character rather than letting the
          # shell expand it -- so a secret provisioned as
          # "~/.multica/..." would silently point at a directory that can
          # never exist, exactly the CHE-768 symptom this fix addresses.
          # Require an absolute path and refuse anything else outright
          # rather than attempting our own tilde/variable expansion, which
          # would mean evaluating attacker- or operator-controlled shell
          # syntax from a repository secret.
          case "$C00_ROUTER_STATE_DIR" in
            /*) : ;;
            *)
              echo "C00_ROUTER_STATE_DIR must be an absolute path (got '${C00_ROUTER_STATE_DIR}'); a leading ~ is not expanded by render-cutover-remote-script.sh -- provision the secret with C00's real absolute path (e.g. /home/<user>/.multica/ab/deploy/cd/router/state)" >&2
              exit 1
              ;;
          esac

          bash deploy/cd/capture-remote-baseline.sh live-baseline-tuple.json
          decision="$(node deploy/cd/verify-deploy-baseline.mjs "$SOURCE_SHA" "$baseline_path" live-baseline-tuple.json)"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          if [ "$decision" = "skip" ]; then
            exit 0
          fi

          remote_dir="${C00_STATE_DIR%/}/cd-deploy-$(date +%s)"
          router_state_dir="${C00_ROUTER_STATE_DIR%/}"

          # Observe the real database immediately before building the packet.
          # The capture is read-only and fails closed on any unknown ledger,
          # invalid-index or hook state.
          observe_dir="${remote_dir}-observe"
          mkdir -p "$observe_dir"
          cp deploy/cd/capture-release-state.sh "$observe_dir/"
          bash "$observe_dir/capture-release-state.sh" --compose-dir "$C00_COMPOSE_DIR" --output "$observe_dir/observed-state.json"
          cp "$observe_dir/observed-state.json" observed-state.json
          rm -rf "$observe_dir" || true

          bash deploy/cd/build-cutover-bundle.sh \
            --manifest "$manifest_path" \
            --baseline-tuple "$baseline_path" \
            --observed-state observed-state.json \
            --output cutover-controller.tar \
            --checksum-output cutover-controller.tar.sha256
          local_bundle="cutover-controller.tar"
          local_checksum="cutover-controller.tar.sha256"
          sha256sum -c "$local_checksum"

          mkdir -p "$remote_dir"
          # Stage the exact reviewed controller tree, its matching
          # migrations, manifest and packet as one content-addressed bundle.
          cp "$local_bundle" "$local_checksum" "$remote_dir/"

          # set -e would otherwise abort this script the instant the cutover
          # deploy command returns nonzero — before deploy_status could be
          # captured and before the staging cleanup below ever ran. Disable
          # it for exactly this one command, then restore it immediately.
          #
          # GHCR_PULL_TOKEN is exported inside the script piped over stdin,
          # not appended to the command line (a `VAR=value command` prefix
          # would put the secret directly on C00's process list, visible to
          # `ps` from any other account on the host) and not written to a file
          # on C00 (nothing left behind for `remote_dir`'s cleanup below to
          # miss). `set -a` exports every var assigned afterwards, including
          # the one `cutover.sh` reads by name, without listing it a second
          # time.
          set +e
          bash deploy/cd/render-cutover-remote-script.sh \
            --router-state-dir "$router_state_dir" \
            -- bash -c "cd '$remote_dir' && sha256sum -c cutover-controller.tar.sha256 && tar -xf cutover-controller.tar && bash cutover-controller/deploy/cd/verify-cutover-bundle.sh cutover-controller && cd '$C00_COMPOSE_DIR' && . ./.env && export CUTOVER_DATABASE_URL=\"postgres://\${POSTGRES_USER:-multica}:\${POSTGRES_PASSWORD:-multica}@postgres:5432/\${POSTGRES_DB:-multica}?sslmode=disable\" && bash '$remote_dir/cutover-controller/deploy/cd/cutover.sh' cutover --manifest '$remote_dir/cutover-controller/evidence/manifest.json' --packet '$remote_dir/cutover-controller/evidence/release-packet.json' --compose-dir '$C00_COMPOSE_DIR' --state-dir '$C00_CUTOVER_STATE_DIR'" \
            | env -i HOME="$HOME" PATH="$PATH" bash -s
          deploy_status=$?
          set -e

          # CHE-773: bounded post-deploy observation — the public route and
          # the router-selected upstream must stay healthy for 120s. Runs on
          # failure too, so an outage the controller could not repair is
          # annotated on the run instead of being discovered hours later.
          # Read-only; it never restarts or reroutes anything.
          cp deploy/cd/ab-health-check.sh "$remote_dir/" || true
          window=120
          [ "$deploy_status" -eq 0 ] || window=0
          if ! bash "${remote_dir}/ab-health-check.sh" --router-state-dir "$router_state_dir" --cutover-state-dir "$C00_CUTOVER_STATE_DIR" --window "$window"; then
            deploy_status=1
          fi

          # Best-effort cleanup of the staged copy; failure here must
          # never mask the deploy's own exit status.
          rm -rf "$remote_dir" || true

          exit "$deploy_status"

      - name: Record outcome
        if: always() && steps.deploy.outputs.decision != 'skip'
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployed ${{ needs.admission.outputs.source_sha }} to C00."
          else
            echo "::error::Deploy of ${{ needs.admission.outputs.source_sha }} to C00 failed or required manual intervention — see deploy.sh output above for rollback status."
          fi

  # CHE-2365, CHE-5175: immediate readback after a deploy. It waits at most 90
  # seconds for C00 to turn healthy, arms the native health observer (T0 is its
  # first sample), checks the SHA and the image digests against the admitted
  # manifest, records the restart count, and releases the runner. The 15-minute watch is readback-delay plus
  # readback-confirm below. It runs outside the C00 lock so the next deploy is
  # not held; a failure here suspends automatic deploys (authorize-c00 reads
  # this job) and starts the rollback job.
  # CHE-5144: the job runs deploy/cd/ from the workflow revision, not the
  # candidate ref. A candidate cut before a script existed does not have it.
  readback:
    needs: [admission, deploy]
    if: always() && needs.deploy.result == 'success'
    runs-on: [self-hosted, linux, x64, cheese-c00-deploy]
    timeout-minutes: 10
    environment: c00-runtime
    outputs:
      t0: ${{ steps.watch.outputs.t0 }}
      observation: ${{ steps.watch.outputs.observation }}
      superseded: ${{ steps.watch.outputs.superseded }}
      restarts: ${{ steps.window.outputs.restarts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Download the admitted manifest
        uses: actions/download-artifact@v8
        with:
          name: cd-deploy-admitted-input
          path: cutover-input

      - name: Wait for C00 to be healthy, arm the observer, then check SHA and digests
        id: watch
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.admission.outputs.source_sha }}
          OBSERVATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          C00_COMPOSE_DIR: ${{ secrets.C00_COMPOSE_DIR }}
          C00_STATE_DIR: ${{ secrets.C00_STATE_DIR }}
          C00_CUTOVER_STATE_DIR: ${{ secrets.C00_CUTOVER_STATE_DIR }}
          C00_ROUTER_STATE_DIR: ${{ secrets.C00_ROUTER_STATE_DIR }}
        run: bash deploy/cd/post-deploy-readback.sh "$SOURCE_SHA" 90 cutover-input/manifest.json

      - name: Record the restart count
        id: window
        shell: bash
        env:
          C00_COMPOSE_DIR: ${{ secrets.C00_COMPOSE_DIR }}
          C00_CUTOVER_STATE_DIR: ${{ secrets.C00_CUTOVER_STATE_DIR }}
        run: |
          set -euo pipefail
          restarts="$(bash deploy/cd/restart-count.sh)"
          echo "restarts=${restarts}" >> "$GITHUB_OUTPUT"

  # CHE-5175: the 15-minute watch window. The environment's wait timer is the
  # wait, so the job holds no runner while it counts; it only needs a hosted
  # runner for the instant it runs after the timer. The environment
  # c00-readback-delay is main-only like c00-runtime, has a 15-minute wait timer
  # and no secrets: a job can use one environment, and the C00 secrets stay in
  # c00-runtime for readback-confirm. When C00 already runs a newer deploy, the
  # readback outputs superseded=true and no journal: this job and the confirm are
  # skipped, the newer deploy's own run judges its window, and nothing rolls back.
  readback-delay:
    needs: [admission, readback]
    if: always() && needs.readback.result == 'success' && needs.readback.outputs.superseded != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: c00-readback-delay
    permissions: {}
    steps:
      - name: Window elapsed
        run: echo "The 15-minute window after ${{ needs.readback.outputs.t0 }} (epoch seconds) has elapsed."

  # CHE-5175: judge the window from its evidence, on the C00 runner, in seconds.
  # The observer's journal must hold a healthy timer sample for every 10 s slot
  # (a failed sample stays failed after recovery), docker events since T0 must
  # show no unhealthy, die, oom or restart on the active colour, the restart
  # count must not have grown, and the SHA and
  # digests must be unchanged or C00 must run a newer deploy that descends from
  # this one. A failure here suspends automatic deploys and starts the rollback.
  readback-confirm:
    needs: [admission, readback, readback-delay]
    if: always() && needs.readback-delay.result == 'success'
    runs-on: [self-hosted, linux, x64, cheese-c00-deploy]
    timeout-minutes: 10
    environment: c00-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Download the admitted manifest
        uses: actions/download-artifact@v8
        with:
          name: cd-deploy-admitted-input
          path: cutover-input

      - name: Verify the 15-minute window from the observer journal
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.admission.outputs.source_sha }}
          T0: ${{ needs.readback.outputs.t0 }}
          OBSERVATION_ID: ${{ needs.readback.outputs.observation }}
          RESTARTS: ${{ needs.readback.outputs.restarts }}
          C00_COMPOSE_DIR: ${{ secrets.C00_COMPOSE_DIR }}
          C00_STATE_DIR: ${{ secrets.C00_STATE_DIR }}
          C00_CUTOVER_STATE_DIR: ${{ secrets.C00_CUTOVER_STATE_DIR }}
          C00_ROUTER_STATE_DIR: ${{ secrets.C00_ROUTER_STATE_DIR }}
        run: bash deploy/cd/post-deploy-confirm.sh check "$SOURCE_SHA" "$T0" "$RESTARTS" "$OBSERVATION_ID" cutover-input/manifest.json

  # CHE-2365, CHE-5175: a failed readback, readback-delay or readback-confirm
  # rolls C00 back by digest to the retained predecessor (a failed delay skips
  # the confirm, so nothing judged the window). The failed job is also what
  # suspends automatic deploys (authorize-c00 reads it), so the run stays red
  # whatever this job does. It
  # takes the C00 lock because it changes C00; the script skips when a newer
  # deploy already replaced the deployed commit. A cancelled readback is a
  # person's decision and is not rolled back.
  # CHE-5144: it runs the workflow revision's cutover.sh and scripts, not the
  # candidate's, for the same reason as readback.
  rollback:
    needs: [admission, readback, readback-delay, readback-confirm]
    if: always() && (needs.readback.result == 'failure' || needs.readback-delay.result == 'failure' || needs.readback-confirm.result == 'failure')
    runs-on: [self-hosted, linux, x64, cheese-c00-deploy]
    timeout-minutes: 30
    environment: c00-runtime
    permissions:
      contents: read
      actions: read
      packages: read
    concurrency:
      group: cd-deploy-c00
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Roll C00 back to the retained predecessor
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.admission.outputs.source_sha }}
          C00_COMPOSE_DIR: ${{ secrets.C00_COMPOSE_DIR }}
          C00_STATE_DIR: ${{ secrets.C00_STATE_DIR }}
          C00_CUTOVER_STATE_DIR: ${{ secrets.C00_CUTOVER_STATE_DIR }}
          C00_ROUTER_STATE_DIR: ${{ secrets.C00_ROUTER_STATE_DIR }}
          GHCR_PULL_TOKEN: ${{ github.token }}
        run: bash deploy/cd/rollback-failed-readback.sh "$SOURCE_SHA"
