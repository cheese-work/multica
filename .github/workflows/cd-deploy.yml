name: CD deploy to C00

# D2 (CHE-530): deploys an already-admitted release-candidate tuple to the
# live C00 self-host stack. This workflow is the ONLY place in the repo that
# holds C00 credentials (SSH key, host, deploy user) — D1's
# cd-qualification.yml is read-only and deliberately carries none of them
# (see the comment at the top of that file and deploy/cd/README.md).
#
# It runs automatically after a SUCCESSFUL cd-qualification run for a `main`
# commit (acceptance item 1: a merge to main reaches C00 with no human step),
# and can still be dispatched by hand for a re-deploy or a manual admission.
#
# The automatic path needs one job the manual path does not:
# prepare-release-candidate. D1 publishes a `build-evidence` manifest, and
# admission.mjs REFUSES build-evidence for deployment — a deployable
# `release-candidate` manifest additionally binds the baseline tuple of the
# host being deployed to, which only a stage with C00 access can read. That
# job reads the live baseline over the same SSH credentials the deploy job
# uses, re-issues D1's evidence as a release-candidate bound to it, and hands
# the result to the unchanged admission and deploy jobs. admission.mjs is not
# weakened to make this fit: it still verifies the manifest, the event, the
# provenance digests and the required checks, and still refuses
# build-evidence.
on:
  workflow_run:
    workflows: ["CD qualification build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      manifest_path:
        description: "Path (relative to repo root, at the checked-out ref) to the release-candidate manifest JSON"
        required: true
      baseline_tuple_path:
        description: "Path to the C00 tuple snapshot the manifest was qualified against"
        required: true
      event_path:
        description: "Path to the recorded {event_name, ref, repository, sha} JSON for the qualifying push"
        required: true
      checks_path:
        description: "Path to the recorded {sha, contexts} required-checks JSON"
        required: true
      provenance_path:
        description: "Path to the recorded image provenance JSON (backend/web digest + architecture + repository + source_sha)"
        required: true
      ref:
        description: "Git ref to check out (must match the manifest's source_sha)"
        required: true
        default: main

# This workflow deliberately has no build step and never touches the
# registry beyond a pull performed on C00 itself over the deploy SSH
# session — it only reads already-published, already-admitted evidence and
# mutates C00.
permissions:
  contents: read
  actions: read

concurrency:
  # One deploy at a time, repo-wide: a second dispatch while one is running
  # queues instead of racing a second SSH session against the same compose
  # stack. deploy.sh's own flock on C00 is the second, host-local layer of
  # the same guarantee for anyone who runs it by hand outside this workflow.
  group: cd-deploy-c00
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Automatic path only. Turns D1's build-evidence into a deployable
  # release-candidate by binding it to C00's CURRENT baseline tuple.
  #
  # This job needs C00 SSH access to read that baseline, so it runs on the
  # same C00-reachable runner and the same protected environment as the
  # deploy job. It reads and writes nothing on C00 beyond a temp file it
  # removes: capture-tuple.sh inspects containers and runs one SELECT.
  # ---------------------------------------------------------------------------
  prepare-release-candidate:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, x64, cheese-c00-deploy]
    timeout-minutes: 15
    environment: c00-production
    outputs:
      source_sha: ${{ steps.evidence.outputs.source_sha }}
    steps:
      - name: Checkout the qualified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history, not a shallow clone: the baseline step resolves the
          # short image tag C00 is currently running into a full commit SHA
          # with `git rev-parse`, and a depth-1 checkout contains only the
          # qualified commit itself — every older deployed tag would fail to
          # resolve.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download D1 build evidence
        uses: actions/download-artifact@v4
        with:
          name: cd-build-evidence-${{ github.event.workflow_run.head_sha }}
          path: d1-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read C00's current baseline tuple
        env:
          C00_SSH_HOST: ${{ secrets.C00_SSH_HOST }}
          C00_SSH_USER: ${{ secrets.C00_SSH_USER }}
          C00_SSH_KEY: ${{ secrets.C00_SSH_KEY }}
          C00_COMPOSE_DIR: ${{ secrets.C00_COMPOSE_DIR }}
          C00_STATE_DIR: ${{ secrets.C00_STATE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$C00_SSH_KEY" > ~/.ssh/c00_deploy_key
          chmod 600 ~/.ssh/c00_deploy_key
          ssh-keyscan -H "$C00_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh_cmd=(ssh -i ~/.ssh/c00_deploy_key -o BatchMode=yes "${C00_SSH_USER}@${C00_SSH_HOST}")
          remote_dir="${C00_STATE_DIR%/}/cd-baseline-$(date +%s)"

          "${ssh_cmd[@]}" "mkdir -p '$remote_dir'"
          scp -i ~/.ssh/c00_deploy_key -o BatchMode=yes \
            deploy/cd/capture-tuple.sh deploy/cd/tuple-snapshot.mjs \
            "${C00_SSH_USER}@${C00_SSH_HOST}:${remote_dir}/"

          # Resolve the deployed commit HERE, on the runner, and pass it in —
          # but ONLY when the image cannot speak for itself.
          #
          # Precedence, highest first:
          #   1. the image's own org.opencontainers.image.revision label
          #   2. this workflow's tag-based git resolution
          #
          # The label is authoritative: it is what the image was actually built
          # from, recorded at build time by D1. A tag is a name someone chose
          # and can be wrong or reused. So when the label is present we pass
          # nothing and let capture-tuple.sh read it directly; passing
          # --application-sha would unconditionally override the label, which
          # inverts this precedence and lets a tag-guess beat the truth.
          #
          # The tag path exists because C00 may still be running images not
          # built by D1, which carry no label — only a short SHA tag. Expanding
          # that needs a git checkout, and the script runs on C00 from a bare
          # scp'd temp directory with no repository, so the runner (which has
          # the checkout) does the lookup.
          #
          # Never substitute this workflow's own commit — that would record a
          # baseline claiming C00 runs something it does not.
          baseline_sha=""
          deployed_label="$("${ssh_cmd[@]}" "docker inspect --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}}' \"\$(cd '${C00_COMPOSE_DIR}' && docker compose -f docker-compose.selfhost.yml ps -q backend)\"" 2>/dev/null | tr -d '[:space:]' || true)"

          if [[ "$deployed_label" =~ ^[a-f0-9]{40}$ ]]; then
            echo "C00's backend image carries revision label ${deployed_label}; deferring to it (no --application-sha)"
          else
            deployed_tag="$("${ssh_cmd[@]}" "cd '${C00_COMPOSE_DIR}' && docker compose -f docker-compose.selfhost.yml images backend --format json" 2>/dev/null \
              | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{const r=JSON.parse(d||"[]");const x=Array.isArray(r)?r[0]:r;process.stdout.write(x&&x.Tag?String(x.Tag):"")}catch{process.stdout.write("")}})' || true)"
            candidate="${deployed_tag#sha-}"
            if [[ "$candidate" =~ ^[a-f0-9]{7,40}$ ]]; then
              baseline_sha="$(git rev-parse --verify --quiet "${candidate}^{commit}" 2>/dev/null || true)"
            fi
          fi

          capture_args=(--compose-dir "'${C00_COMPOSE_DIR}'" --output "'${remote_dir}/baseline-tuple.json'")
          if [[ "$baseline_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "no usable revision label; resolved C00's deployed image tag '${deployed_tag}' to commit ${baseline_sha}"
            capture_args+=(--application-sha "'${baseline_sha}'")
          elif ! [[ "$deployed_label" =~ ^[a-f0-9]{40}$ ]]; then
            echo "could not resolve C00's deployed tag '${deployed_tag:-<none>}' to a commit; capture-tuple.sh will fail loudly with its own diagnostic"
          fi

          set +e
          "${ssh_cmd[@]}" "bash '${remote_dir}/capture-tuple.sh' ${capture_args[*]}"
          capture_status=$?
          set -e

          if [ "$capture_status" -eq 0 ]; then
            scp -i ~/.ssh/c00_deploy_key -o BatchMode=yes \
              "${C00_SSH_USER}@${C00_SSH_HOST}:${remote_dir}/baseline-tuple.json" \
              baseline-tuple.json
          fi
          "${ssh_cmd[@]}" "rm -rf '$remote_dir'" || true
          exit "$capture_status"

      - name: Issue the release-candidate manifest
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${{ github.event.workflow_run.head_sha }}"

          # The release-candidate carries D1's own digests unchanged — this
          # stage re-binds evidence, it never re-qualifies an image. Reading
          # them back out of D1's manifest (rather than accepting them as
          # inputs) is what keeps "the exact pair D1 qualified" true by
          # construction for acceptance item 2.
          read_field() {
            node -e 'const m=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(String(process.argv[2].split(".").reduce((a,k)=>a?.[k],m)))' \
              d1-evidence/cd-build-evidence.json "$1"
          }
          d1_source_sha="$(read_field source_sha)"
          if [ "$d1_source_sha" != "$source_sha" ]; then
            echo "::error::D1 evidence is for $d1_source_sha but this run qualified $source_sha"
            exit 1
          fi

          node deploy/cd/release-manifest.mjs create \
            --kind release-candidate \
            --repository "$(read_field repository)" \
            --source-sha "$source_sha" \
            --architecture "$(read_field architecture)" \
            --configuration-sha256 "$(read_field configuration_sha256)" \
            --migration-inventory-sha256 "$(read_field migration_inventory_sha256)" \
            --backend-image "$(read_field images.backend)" \
            --web-image "$(read_field images.web)" \
            --baseline-tuple-sha256 "$(node deploy/cd/tuple-snapshot.mjs digest --snapshot baseline-tuple.json)" \
            --output cd-release-candidate.json

          # admission.mjs checks the qualifying event and the required check
          # contexts. Record both from the API rather than asserting them:
          # the event comes from the workflow_run payload this job was
          # triggered by, the checks from the commit's own check runs.
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync("cd-event.json", `${JSON.stringify({
              event_name: process.env.RUN_EVENT,
              ref: `refs/heads/${process.env.RUN_BRANCH}`,
              repository: process.env.GITHUB_REPOSITORY,
              sha: process.env.SOURCE_SHA,
            }, null, 2)}\n`);
          '
          cp d1-evidence/cd-image-provenance.json cd-provenance.json
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
        env:
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Install the YAML parser the path-filter reader needs
        shell: bash
        run: bash deploy/cd/ensure-pyyaml.sh

      - name: Record the required-check results for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # admission.mjs requires backend, frontend, mobile and
          # cd-qualification to all be "success" for this exact SHA. Take
          # them from the commit's check runs — the same source a human
          # reading the PR would use — rather than asserting them here.
          gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}/check-runs?per_page=100" \
            --paginate --jq '.check_runs[] | {name, conclusion}' > check-runs.jsonl

          # Some required checks are path-filtered and legitimately do not run
          # on a commit that touches none of their paths (`mobile` is one).
          # Admission must be able to tell "excluded" from "missing", so record
          # the raw evidence for that decision rather than the decision itself:
          # the commit's changed files, and each check's declared path filter
          # read out of the workflow that defines it. admission.mjs re-derives
          # the match; nothing here asserts a check may be skipped.
          gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}" \
            --jq '{files: [.files[]?.filename], truncated: ((.files | length) >= 300)}' > commit-files.json

          # Parse the workflows with a real YAML parser rather than regexes —
          # `on:` blocks vary in formatting enough that pattern-matching them
          # silently misses filters, and a missed filter here would be read as
          # "check absent for no reason" downstream. The script lives in a file
          # rather than a heredoc: a heredoc body inside this block scalar
          # cannot be indented below the block's own margin, which GitHub's
          # workflow parser rejects outright.
          python3 deploy/cd/workflow-path-filters.py > path-filters.json

          node -e '
            const fs = require("node:fs");

            const contexts = {};
            for (const line of fs.readFileSync("check-runs.jsonl", "utf8").split("\n")) {
              if (!line.trim()) continue;
              const run = JSON.parse(line);
              contexts[run.name] = run.conclusion;
            }

            const commit = JSON.parse(fs.readFileSync("commit-files.json", "utf8"));
            const pathFilters = JSON.parse(fs.readFileSync("path-filters.json", "utf8"));

            fs.writeFileSync("cd-checks.json", `${JSON.stringify({
              sha: process.env.SOURCE_SHA,
              contexts,
              changed_files: commit.files ?? [],
              changed_files_truncated: Boolean(commit.truncated),
              path_filters: pathFilters,
            }, null, 2)}\n`);
          '

      - name: Upload the release-candidate evidence set
        uses: actions/upload-artifact@v4
        with:
          name: cd-release-candidate-${{ github.event.workflow_run.head_sha }}
          path: |
            cd-release-candidate.json
            baseline-tuple.json
            cd-event.json
            cd-checks.json
            cd-provenance.json
          retention-days: 30
          if-no-files-found: error

  admission:
    # Admission is a read-only evidence check — it never touches C00 — so it
    # can run on a regular GitHub-hosted runner. Only the deploy job below
    # needs the dedicated C00-reachable runner and secrets.
    needs: prepare-release-candidate
    # The manual path skips prepare-release-candidate entirely (its caller
    # supplies an already-issued manifest), so this must not be skipped just
    # because that job did not run.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.prepare-release-candidate.result == 'success')
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.verify_admission.outputs.source_sha }}
      ref: ${{ steps.paths.outputs.ref }}
      manifest_path: ${{ steps.paths.outputs.manifest_path }}
    steps:
      - name: Resolve the evidence set for this trigger
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "ref=${{ inputs.ref }}"
              echo "manifest_path=${{ inputs.manifest_path }}"
              echo "baseline_tuple_path=${{ inputs.baseline_tuple_path }}"
              echo "event_path=${{ inputs.event_path }}"
              echo "checks_path=${{ inputs.checks_path }}"
              echo "provenance_path=${{ inputs.provenance_path }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "ref=${{ github.event.workflow_run.head_sha }}"
              echo "manifest_path=cd-evidence/cd-release-candidate.json"
              echo "baseline_tuple_path=cd-evidence/baseline-tuple.json"
              echo "event_path=cd-evidence/cd-event.json"
              echo "checks_path=cd-evidence/cd-checks.json"
              echo "provenance_path=cd-evidence/cd-provenance.json"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.paths.outputs.ref }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download the prepared evidence set
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: cd-release-candidate-${{ github.event.workflow_run.head_sha }}
          path: cd-evidence

      - name: Verify admission
        id: verify_admission
        shell: bash
        env:
          MANIFEST_PATH: ${{ steps.paths.outputs.manifest_path }}
          BASELINE_TUPLE_PATH: ${{ steps.paths.outputs.baseline_tuple_path }}
          EVENT_PATH: ${{ steps.paths.outputs.event_path }}
          CHECKS_PATH: ${{ steps.paths.outputs.checks_path }}
          PROVENANCE_PATH: ${{ steps.paths.outputs.provenance_path }}
        run: |
          set -euo pipefail
          config_sha="$(node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(m.configuration_sha256)' "$MANIFEST_PATH")"
          migration_sha="$(node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(m.migration_inventory_sha256)' "$MANIFEST_PATH")"
          source_sha="$(node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(m.source_sha)' "$MANIFEST_PATH")"
          node deploy/cd/admission.mjs verify \
            --manifest "$MANIFEST_PATH" \
            --baseline-tuple "$BASELINE_TUPLE_PATH" \
            --event "$EVENT_PATH" \
            --checks "$CHECKS_PATH" \
            --provenance "$PROVENANCE_PATH" \
            --repository "${{ github.repository }}" \
            --source-sha "$source_sha" \
            --configuration-sha256 "$config_sha" \
            --migration-inventory-sha256 "$migration_sha"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Upload admitted manifest for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: cd-deploy-admitted-manifest
          path: ${{ steps.paths.outputs.manifest_path }}
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: admission
    # Reserved for the C00-reachable deploy runner, distinct from D1's
    # cheese-x99 build runner label. See multica-cheese-work-runtimes for the
    # current host/runner-label mapping; this label is a placeholder for
    # whichever self-hosted runner has network access to C00.
    runs-on: [self-hosted, linux, x64, cheese-c00-deploy]
    timeout-minutes: 30
    environment: c00-production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.admission.outputs.ref }}
          fetch-depth: 1

      - name: Download admitted manifest
        uses: actions/download-artifact@v4
        with:
          name: cd-deploy-admitted-manifest
          path: cd-deploy-manifest

      - name: Deploy to C00 over SSH
        shell: bash
        env:
          # The only C00 credentials in this repository. Scoped to this
          # workflow/job only — cd-qualification.yml (D1) has none of these
          # and must stay that way (see its own header comment).
          C00_SSH_HOST: ${{ secrets.C00_SSH_HOST }}
          C00_SSH_USER: ${{ secrets.C00_SSH_USER }}
          C00_SSH_KEY: ${{ secrets.C00_SSH_KEY }}
          C00_COMPOSE_DIR: ${{ secrets.C00_COMPOSE_DIR }}
          C00_STATE_DIR: ${{ secrets.C00_STATE_DIR }}
          # read:packages-only PAT (CHE-549) — C00 has no ambient registry
          # credential, so deploy.sh logs in to ghcr.io with this immediately
          # before its pull step and logs out unconditionally afterwards (see
          # deploy.sh's own comment). Forwarded to the remote shell as an
          # exported var, never interpolated into the command line, so it
          # never appears in a process listing or shell history on C00.
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          MANIFEST_PATH: ${{ needs.admission.outputs.manifest_path }}
        run: |
          set -euo pipefail
          manifest_basename="$(basename "$MANIFEST_PATH")"
          local_manifest="cd-deploy-manifest/${manifest_basename}"

          mkdir -p ~/.ssh
          printf '%s\n' "$C00_SSH_KEY" > ~/.ssh/c00_deploy_key
          chmod 600 ~/.ssh/c00_deploy_key
          ssh-keyscan -H "$C00_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh_cmd=(ssh -i ~/.ssh/c00_deploy_key -o BatchMode=yes "${C00_SSH_USER}@${C00_SSH_HOST}")
          remote_dir="${C00_STATE_DIR%/}/cd-deploy-$(date +%s)"

          "${ssh_cmd[@]}" "mkdir -p '$remote_dir'"
          # capture-tuple.sh, tuple-snapshot.mjs and deploy-lib.sh all travel
          # with deploy.sh: deploy.sh delegates its post-deploy tuple
          # recording to the first two and sources deploy-lib.sh directly
          # for its own JSON/image/migration helpers (CHE-397 unit 2's
          # shared-library extraction) — it refuses to start if any of the
          # three are absent from its own script_dir (see deploy.sh's
          # file-existence checks immediately after usage()). A transfer
          # set missing any one of them fails deploy.sh before it does
          # anything, on C00, not in CI — this exact omission for
          # deploy-lib.sh was caught only by reproducing this scp's file
          # list locally (independent review of CHE-608).
          scp -i ~/.ssh/c00_deploy_key -o BatchMode=yes \
            deploy/cd/deploy.sh deploy/cd/deploy-lib.sh deploy/cd/capture-tuple.sh deploy/cd/tuple-snapshot.mjs \
            "$local_manifest" \
            "${C00_SSH_USER}@${C00_SSH_HOST}:${remote_dir}/"

          # set -e would otherwise abort this script the instant the SSH
          # deploy command returns nonzero — before deploy_status could be
          # captured and before the remote cleanup below ever ran. Disable
          # it for exactly this one command, then restore it immediately.
          #
          # GHCR_PULL_TOKEN is exported inside a script piped over the SSH
          # session's stdin, not appended to the remote command line (a
          # `VAR=value command` prefix on the ssh argument itself would put
          # the secret directly on C00's process list, visible to `ps` from
          # any other account on the host) and not written to a file on C00
          # (nothing left behind for `remote_dir`'s cleanup below to miss).
          # `set -a` exports every var assigned afterwards, including the one
          # `deploy.sh` reads by name, without listing it a second time.
          set +e
          {
            printf 'set -a\n'
            printf 'GHCR_PULL_TOKEN=%q\n' "$GHCR_PULL_TOKEN"
            printf 'set +a\n'
            printf "bash '%s/deploy.sh' --manifest '%s/%s' --compose-dir '%s' --state-dir '%s'\n" \
              "$remote_dir" "$remote_dir" "$manifest_basename" "$C00_COMPOSE_DIR" "$C00_STATE_DIR"
          } | "${ssh_cmd[@]}" bash -s
          deploy_status=$?
          set -e

          # Best-effort cleanup of the transferred copy; failure here must
          # never mask the deploy's own exit status.
          "${ssh_cmd[@]}" "rm -rf '$remote_dir'" || true

          exit "$deploy_status"

      - name: Record outcome
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployed ${{ needs.admission.outputs.source_sha }} to C00."
          else
            echo "::error::Deploy of ${{ needs.admission.outputs.source_sha }} to C00 failed or required manual intervention — see deploy.sh output above for rollback status."
          fi
