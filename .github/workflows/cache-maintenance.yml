# ci-policy: class=scheduled
name: Build cache maintenance

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  # CHE-4250: Main Build only. A run per completed PR CI run burned API calls; the schedule bounds the rest.
  workflow_run:
    workflows: ['Main Build']
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: build-cache-maintenance
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository_owner == 'cheese-work'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Test cache retention policy
        run: python3 .github/scripts/test_cache_policy.py
      - name: Delete superseded caches within the free budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/cache-policy.py
