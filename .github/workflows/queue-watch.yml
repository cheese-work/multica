# ci-policy: class=scheduled
name: Queue stall alarms

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/queue-watch.yml
      - deploy/cd/check-deploy-queue.py
      - deploy/cd/test-check-deploy-queue.py
      - scripts/merge-queue-watch.py
      - scripts/merge-queue-watch.test.py
      - scripts/fixtures/merge-queue-watch/**

permissions:
  contents: read
  actions: read

# Two alarms, one file: C00 deploy queue stall and merge queue stall. Separate jobs so one failing alarm never hides the other.
# Deliberately no concurrency group, no self-hosted runner and no merge_group trigger: a stuck queue, a dead runner,
# a held cd-deploy-c00 lock or a missing required check must not suppress either alarm. Public repo: GitHub-hosted minutes are free.
jobs:
  cd-queue-alarm:
    name: C00 deploy queue alarm
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify queue-age regression cases
        run: python3 deploy/cd/test-check-deploy-queue.py
      - name: Check active deployment queues (read-only)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/cd/check-deploy-queue.py

  merge-queue-alarm:
    name: Merge queue stall alarm
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify stall regression cases
        run: python3 scripts/merge-queue-watch.test.py
      - name: Check merge queue (read-only)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/merge-queue-watch.py
