name: PR Changelog Check

# Prints the /changelog entry this PR will publish (CHE-1631). Fails a feat/fix/perf
# PR without a valid `Changelog:` line. Runs for any base branch so stack layers see
# their own result. The PR body comes from the event payload; no token, no secrets.
# Runs on X99 only for same-repository pull requests that are not upstream-sync/*; fork
# and sync heads fall back to GitHub-hosted (the script reports sync heads as
# `Hidden: upstream-sync` and passes).
# Making this check required in branch protection is Cheese's call.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-changelog-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog-line:
    name: Changelog line
    if: github.event.pull_request.state != 'closed'
    runs-on: ${{ github.repository_owner == 'cheese-work' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !startsWith(github.head_ref || github.ref_name, 'upstream-sync/') && fromJSON('["self-hosted","Linux","X64","cheese-x99"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      # Heals workspaces a past sparse checkout left with core.sparseCheckout=true: the
      # checkout action's own disable is undone when it unsets extensions.worktreeConfig (CHE-1961).
      - name: Reset leaked sparse-checkout state
        run: |
          [ -d "$GITHUB_WORKSPACE/.git" ] || exit 0
          git -C "$GITHUB_WORKSPACE" config --local --unset-all core.sparseCheckout || true
      # Full checkout on purpose: a sparse input would leak the same state again.
      - name: Checkout the check script
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Compute the changelog entry
        run: node scripts/fork-changelog.mjs --event "$GITHUB_EVENT_PATH"
