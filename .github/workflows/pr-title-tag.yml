name: pr-title-tag

# Fails a PR whose title does not end with exactly one [squash] or [merge] tag
# (CHE-1678). Reports only; it does not change merge settings.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  pr-title-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - run: bash .github/scripts/pr-title-tag_test.sh
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: bash .github/scripts/pr-title-tag.sh "$TITLE"
