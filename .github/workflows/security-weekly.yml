# CHE-3701: weekly full-tree security scan of the fork. Informational: findings never fail a job; a scanner that
# cannot run does, so a broken scan is never read as clean. Read-only token, GitHub-hosted runners, no secrets, no image build.
# This repo is public, so artifacts and logs are world-readable: every report is sealed (scripts/security-weekly/seal.sh) to a
# key only X99 holds, and nothing about findings is printed. The Monday brief unseals, summarizes and files on X99
# (scripts/security-weekly/weekly.sh). Schedule is the only trigger: GitHub runs it on the default branch only. pull_request and
# workflow_dispatch (which takes any branch via --ref) would run a branch's own recipient.asc, so its author could read the sealed
# reports. A merged PR could also swap recipient.asc: seal.sh pins the key fingerprint below, and CODEOWNERS routes any change to
# the key, seal.sh or this file to the owner. security-gate.yml still gates PR diffs; this covers the whole tree, dependencies and images.
name: security-weekly

on:
  schedule:
    - cron: "0 16 * * 0" # Sunday 23:00 ICT, so results land in the Monday brief

permissions:
  contents: read

concurrency:
  group: security-weekly-${{ github.ref }}
  cancel-in-progress: true

env:
  # Primary fingerprint of the X99 key (secret half in /mnt/ssd2/security-weekly/gnupg). seal.sh refuses any other recipient.
  SECURITY_WEEKLY_FPR: 1A9377889F3E812D256D3612A32DB5293024988D
  GOVULNCHECK_VERSION: "v1.8.0"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  TRIVY_VERSION: "0.76.1"
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0

jobs:
  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Scan the whole tree with the security-gate rule packs
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --quiet semgrep==1.183.0
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan --metrics=off --disable-version-check --disable-nosem --quiet --json --timeout 30 \
            --config p/default --config p/golang --config p/gosec --config p/typescript --config p/python --config p/kotlin . > semgrep.json
      - name: Seal the report
        run: bash scripts/security-weekly/seal.sh semgrep.json
      - uses: actions/upload-artifact@v7
        with:
          name: weekly-report-semgrep
          path: semgrep.json.gpg
          if-no-files-found: error
          retention-days: 14

  govulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "~1.27.3"
          check-latest: true
          cache-dependency-path: server/go.sum
      - name: Install govulncheck (pinned, from outside the checkout)
        # A module-defined tool would resolve the scanner through server/go.mod, which CODEOWNERS does not cover: a merged `replace` there
        # would run substituted code before the report is sealed. Outside any module, the version below is the only input.
        working-directory: ${{ runner.temp }}
        env:
          GOFLAGS: ""
          GOWORK: "off"
        run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
      - name: Scan Go dependencies
        working-directory: server
        # exit 3 = vulnerabilities found, which is a result; any other non-zero is a scanner failure
        run: '"$(go env GOPATH)/bin/govulncheck" ./... > ../govulncheck.txt || [ $? -eq 3 ]'
      - name: Seal the report
        run: bash scripts/security-weekly/seal.sh govulncheck.txt
      - uses: actions/upload-artifact@v7
        with:
          name: weekly-report-govulncheck
          path: govulncheck.txt.gpg
          if-no-files-found: error
          retention-days: 14

  pnpm-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm from npm (no checkout script runs before the report is sealed)
        run: |
          version="$(node -p 'const v = require("./package.json").packageManager; if (!/^pnpm@\d+\.\d+\.\d+$/.test(v)) throw new Error("exact pnpm version required"); v.slice(5)')"
          npm install --prefix "$RUNNER_TEMP/pnpm" "pnpm@$version"
          echo "$RUNNER_TEMP/pnpm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Audit pnpm-lock.yaml
        # exit 1 = advisories found; the report must still parse and carry `advisories`
        run: |
          pnpm audit --json > pnpm-audit.json || true
          node -e 'if (!JSON.parse(require("fs").readFileSync("pnpm-audit.json", "utf8")).advisories) process.exit(1)'
      - name: Seal the report
        run: bash scripts/security-weekly/seal.sh pnpm-audit.json
      - uses: actions/upload-artifact@v7
        with:
          name: weekly-report-pnpm-audit
          path: pnpm-audit.json.gpg
          if-no-files-found: error
          retention-days: 14

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the full history
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 0 --report-format json --report-path gitleaks.json .
      - name: Seal the report
        run: bash scripts/security-weekly/seal.sh gitleaks.json
      - uses: actions/upload-artifact@v7
        with:
          name: weekly-report-gitleaks
          path: gitleaks.json.gpg
          if-no-files-found: error
          retention-days: 14

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: "~1.27.3"
          check-latest: true
          cache-dependency-path: server/go.sum
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      # upload: never keeps the token read-only and avoids a clash with a repo-level default setup.
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          upload: never
          output: codeql-out
      - run: cp codeql-out/*.sarif "codeql-${{ matrix.language }}.sarif"
      - name: Seal the report
        run: bash scripts/security-weekly/seal.sh codeql-${{ matrix.language }}.sarif
      - uses: actions/upload-artifact@v7
        with:
          name: weekly-report-codeql-${{ matrix.language }}
          path: codeql-${{ matrix.language }}.sarif.gpg
          if-no-files-found: error
          retention-days: 14

  image-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Find the latest qualified image digests
        # cd-qualification.yml publishes backend/web to GHCR and records their digests in cd-build-evidence-<sha> (30 days).
        # This job only pulls manifests to scan them: nothing is built here.
        run: |
          run_id="$(gh run list --workflow cd-qualification.yml --branch main --status success --limit 1 --json databaseId,headSha --jq '.[0].databaseId')"
          sha="$(gh run list --workflow cd-qualification.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha')"
          [ -n "$run_id" ] || { echo "no successful cd-qualification run"; exit 1; }
          gh run download "$run_id" --name "cd-build-evidence-$sha" --dir evidence
          for image in backend web; do
            digest="$(node -p "require('./evidence/cd-image-provenance.json').images['$image'].digest")"
            echo "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
            echo "${image^^}_REF=ghcr.io/${GITHUB_REPOSITORY_OWNER}/multica-${image}@${digest}" >> "$GITHUB_ENV"
          done
      - name: Scan both images
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/trivy.tgz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" image --image-src remote --scanners vuln --quiet --format json --output trivy-backend.json "$BACKEND_REF"
          "$RUNNER_TEMP/trivy" image --image-src remote --scanners vuln --quiet --format json --output trivy-web.json "$WEB_REF"
      - name: Seal the report
        run: bash scripts/security-weekly/seal.sh trivy-*.json
      - uses: actions/upload-artifact@v7
        with:
          name: weekly-report-trivy
          path: trivy-*.json.gpg
          if-no-files-found: error
          retention-days: 14
