# ci-policy: class=scheduled
# Security-gate sweep (CHE-4385), switched OFF by Cheese (CHE-5126; this change: CHE-5148).
#
# The 30-minute schedule is removed so it stops spending runner minutes. What is left is a manual backfill: it posts
# `security-gate` = `success` on the head of every open PR whose latest `security-gate` status is not `success`.
#   gh workflow run security-gate-sweep.yml -R cheese-work/multica --ref main
# Switch the gate back on by reverting the CHE-5148 PR (the schedule and the verdict re-read come back with it).
# Nothing from a PR head is checked out or executed; the job holds no secret.

name: security-gate-sweep

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Post security-gate success on every open PR head that is not green (gate off, CHE-5126)
        run: |
          set -euo pipefail
          # Each read is assigned on its own so a failed API call fails the step; an empty list is never assumed.
          pulls="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | "\(.number) \(.head.sha)"')"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          count=0
          while read -r number sha; do
            [ -n "$number" ] || continue
            state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" \
              --jq '[.statuses[] | select(.context == "security-gate")][0].state // ""')"
            [ "$state" = success ] && continue
            gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state=success -f context=security-gate \
              -f "description=security gate off (CHE-5126)" -f "target_url=$run_url" >/dev/null
            echo "PR #$number $sha: ${state:-none} -> success"
            count=$((count + 1))
          done <<<"$pulls"
          echo "backfilled $count PR head(s)"
