# golangci-lint configuration for the Go backend (CHE-621).
#
# Enforcement is scoped to changed code, not the whole module. The repository
# had no Go linter before this file, so a whole-module gate would start red:
# 650 findings in non-test code, mostly unchecked errors that predate any of
# this. CI therefore runs with --new-from-merge-base, which fails a pull
# request only for findings it introduces. Running `make lint-go` locally
# lints everything, so the backlog stays visible and can be paid down
# deliberately rather than blocking unrelated work.
version: "2"

run:
  timeout: 10m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # Leaked response bodies are a real production failure, not a style note.
    - bodyclose
    # Comparing errors with == instead of errors.Is silently stops matching
    # once anything in the chain starts wrapping.
    - errorlint
    # The closest thing to a DRY / bad-practice checker in this toolchain.
    - gocritic
    - misspell
    # A //nolint without a linter name or a reason disables more than the
    # author meant to, forever.
    - nolintlint
    - revive

  settings:
    errcheck:
      # A type assertion that fails panics; that is worth flagging even
      # though the repository has ignored it up to now.
      check-type-assertions: true
    gocritic:
      # diagnostic only. The style tag produced 839 findings against this
      # codebase -- httpNoBody, unnamedResult, paramTypeCombine -- which is
      # taste disagreeing with an established house idiom, not defects.
      enabled-tags:
        - diagnostic
      disabled-checks:
        # Fires on nearly every switch-free if/else chain here and its advice
        # is a matter of taste, not correctness.
        - ifElseChain
        - singleCaseSwitch
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    staticcheck:
      # QF* are opt-in refactor suggestions ("could remove embedded field"),
      # not defects. SA* (correctness), S* (simplification) and ST1005
      # (error string form) stay on.
      checks:
        - all
        - -QF*
    revive:
      rules:
        - name: indent-error-flow
        - name: errorf
        - name: context-keys-type
        - name: unreachable-code
        - name: superfluous-else

  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # Closing a reader, rolling back an already-committed transaction, and
      # writing to stdout/stderr all return errors that the call site has no
      # useful way to act on. Flagging them trains people to add `_ =` rather
      # than to check anything.
      - linters: [errcheck]
        text: "Error return value of `(.*\\.Close|.*\\.Rollback|fmt\\.Fprint(f|ln)?|os\\.Remove(All)?)` is not checked"

      # Test helpers deliberately ignore errors from fixture setup, and a
      # failure surfaces as the test failing anyway.
      - path: _test\.go
        linters: [errcheck, bodyclose]

      # sqlc emits this package; it is regenerated by `make sqlc` and hand
      # edits there are lost.
      - path: pkg/db/generated/
        linters: [errcheck, gocritic, revive, staticcheck, unused]

      - path: '^(cmd/qoder-runtime/main\.go|internal/integrations/wecom/media_temp_test\.go)$'
        linters: [gocritic]
        text: '^exitAfterDefer:'
        source: 'os\.Exit\((1|43)\)'

      - path: '^internal/(handler/qoder_cleanup\.go|qoderruntime/(bridge|state)\.go)$'
        linters: [gocritic]
        text: '^sloppyReassign:'
        source: 'if err = (h\.DB\.QueryRow|json\.Unmarshal|tx\.Commit|os\.MkdirAll|b\.register|b\.persist|f\.Close|os\.Rename)'

      - path: '^internal/handler/qoder_connection_test\.go$'
        linters: [gocritic]
        text: '^mapKey: suspicious whitespace'
        source: '" https://api\.qoder\.com\.cn/api/v1/cloud"'

      - path: '^internal/qoderruntime/concurrency_test\.go$'
        linters: [gocritic]
        text: '^offBy1:'
        source: 'return rest\[:strings\.Index\(rest, "/"\)\]'

      - path: '^pkg/agent/(acp_panic|hermes_depsync)\.go$'
        linters: [gocritic]
        text: '^appendAssign:'
        source: 'data := append\([dw]\.remains, p\.\.\.\)'

      - path: '^internal/(handler/qoder_catalog\.go|qoderruntime/(bridge|events|prompt)\.go|service/issue_wakeup_condition\.go)$'
        linters: [staticcheck]
        text: '^ST1005:'
        source: '(fmt\.Errorf|errors\.New)\("(Qoder|Multica|Merge conflicts)'

      - path: '^internal/(handler/qoder_catalog_test\.go|qoderruntime/bridge_test\.go)$'
        linters: [staticcheck]
        text: '^ST1013:'
        source: '(401|502)'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
