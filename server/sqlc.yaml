version: "2"
sql:
  - engine: "postgresql"
    queries: "pkg/db/queries/"
    schema:
      - "migrations/"
      - "pkg/db/schema/retired_chat_session_lane_summary.sql"
    gen:
      go:
        package: "db"
        out: "pkg/db/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - column: "issue_wakeup.condition"
            go_type: "encoding/json.RawMessage"
            nullable: true
