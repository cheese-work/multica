# Container-facing entrypoint config for the long-running A/B router
# (docker-compose.router.yml). This file itself is never regenerated or
# swapped by router.sh — only the file it `include`s is.
#
# The included file (router-state/active.conf, a symlink router.sh
# maintains) is a COMPLETE standalone nginx.conf in its own right —
# router.sh's `validate`/`select` run `nginx -t` against each generation
# file directly, mounted as the sole /etc/nginx/nginx.conf, so it must be
# self-sufficient (its own `events`/`http` blocks) to validate standalone.
# nginx's `include` directive splices the named file's tokens in verbatim
# at this point with no scoping of its own, so including a file that itself
# opens `events{}`/`http{}` from here (top level, docker's default
# nginx.conf context) produces exactly the same parsed config as if this
# content had been written inline — nesting is not doubled, because this
# outer file contributes NO directives of its own beyond the include.
include /etc/nginx/router-state/active.conf;
