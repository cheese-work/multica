issue: CHE-7217
design: design/decision-card/approved/direction-b.html @ de59132eab6f4bd50e3ddc7d2654ecf3d9d27831
pages:
  - id: dm-decided-card
    url: /<workspace>/chat/<session>   # DM with a decided run-budget card
    keep: [decision-summary, decision-request-meta, decision-request-runs]
    change: [decision-request-fold-toggle: "names the question (the action title), not the fixed Proposed action heading", decision-request-effect: "labelled as the snapshot at application"]
    remove: []
  - id: issue-decided-card
    url: /<workspace>/issues/<issue>   # issue page, decision cards block
    keep: [decision-summary, decision-request-meta]
    change: [decision-request-fold-toggle: "same as DM", decision-request-effect: "same as DM"]
    remove: [issue-decision-banner-title: "no Decision needed header and no yellow wrapper once the action is decided"]
  - id: issue-approve-panel
    url: /<workspace>/issues/<issue>?approve=<action>   # approve link panel, done view
    keep: []
    change: [decision-action-outcome: "effect line labelled as the snapshot at application"]
    remove: []
  - id: issue-run-budget-meter
    url: /<workspace>/issues/<issue>   # sidebar meter after an owner approves
    keep: [run-budget-meter]
    change: [decision-action-outcome: "same as the approve panel"]
    remove: []
