issue: CHE-1797
design: design/dm-notifications-mobile/rev-1/A.html @ 7c1261d6ff775a889d8e0a46a8d43685f1c5544f
pages:
  - id: settings-notifications
    url: /<workspace-slug>/more/settings/notifications   # mobile route; base and build, no web preview
    keep:
      - notif-group-assignments
      - notif-group-status-changes
      - notif-group-comments
      - notif-group-mentions
      - notif-group-updates
      - notif-group-agent-activity
      - notif-system-notifications
    change:
      - notif-inbox-section: "title stays 'Inbox notifications'; gains an In-app switch row at the top"
      - notif-inbox-inapp-switch: "new: In-app switch for Inbox; off dims and locks the six event rows; save failure reverts the switch"
      - notif-dm-section: "new section 'Direct messages'"
      - notif-dm-inapp-switch: "new: In-app switch for DMs; helper line when off says DM replies won't reach the Inbox"
      - notif-offline-banner: "new: warning banner and locked switches while disconnected"
    remove: []
  - id: inbox-tab
    url: /<workspace-slug>/inbox   # mobile route, Inbox tab
    keep:
      - inbox-row
      - inbox-row-swipe-archive
      - inbox-header-menu
      - inbox-header-search
      - inbox-header-create
      - inbox-empty-state
      - inbox-tab-badge
    change:
      - inbox-filter-chips: "new: All, Unread, Direct messages under the header"
      - inbox-dm-row: "new: dm_reply row with chat glyph where the status icon sits; second line New reply / N new replies / Decision needed; tap opens the DM and marks it read"
      - inbox-filter-empty-state: "new: 'No direct messages' when the DM filter has no rows"
      - inbox-offline-banner: "new: warning banner over saved items while disconnected"
    remove: []
