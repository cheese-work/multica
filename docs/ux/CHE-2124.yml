pages:
  - id: plan-revision-viewer
    url: /:workspace/attachments/:attachmentId/preview
    keep: [revision-document, revision-download, revision-close]
    change:
      - revision-toolbar: One compact row. Below 700 px keep Diff and change navigation visible; secondary controls use one overflow menu.
      - revision-content: Render current Markdown with Diff off; show literal unified or aligned split source with collapsed context when enabled.
      - revision-base: Earlier same-issue revisions, explicit duplicate choice, ICT time and uploader.
    remove: []
