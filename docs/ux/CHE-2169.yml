# In-place /compact divider (CHE-2169, layer L4a). One row is added to the chat message list where a
# compaction happened; no page, tab, composer control or existing message type is added, moved or
# removed. Mobile is layer L4b.
issue: CHE-2169
design: waiver PENDING   # no approved design revision exists for this divider; Cheese owns the waiver or the design pick. The text and timezone are fixed by plan revision 2, closed question 2.
pages:
  - id: chat-dm
    url: /<workspace-slug>/chat?session=<dm-id>   # same path on base and preview
    keep:
      - chat-user-message
      - assistant-message-copy
    change:
      - compaction-divider: "a compaction_summary message renders as a rule with the label 'Compacted at HH:MM ICT' (Asia/Bangkok, 24-hour) instead of a plain assistant bubble; one click expands the summary"
      - compaction-summary: "the expanded summary body, rendered as the same rich content as a reply"
    remove: []
