# DM header "Scheduled" chip (CHE-2400). Lists and cancels pending chat wakeups.
# Design lock waived by Cheese for this chip only (CHE-2400 thread reply 01a185d4-c24a-7b87-b814-ba8bc51e7d61, 29 Oct 2026 11:04 ICT).
# The waiver does not cover UX review, frames, cross-lab review or merge.
issue: CHE-2400
design: waiver CHE-2400 comment 01a185d4-c24a-7b87-b814-ba8bc51e7d61 (waived by Cheese)
pages:
  - id: dm-chat-header
    url: /<workspace-slug>/chat?session=<session-id>   # same path on base and preview
    keep:
      - chat-composer
      - chat-user-message
    change:
      - scheduled-chip: "an outline chip 'Scheduled N' before the context meter; hidden when no wakeup is pending; not shown on an archived DM"
      - scheduled-row: "popover row: fire time in the viewer's timezone, first line of the instruction; the popover title names the creating agent"
      - scheduled-cancel: "Cancel per row; the row leaves the list without a reload; a failure keeps the row and shows a toast"
    remove: []
