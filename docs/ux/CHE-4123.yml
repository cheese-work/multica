pages:
  - id: settings-workspace-background-agents
    url: /<workspace-slug>/settings?tab=background-agents   # 1440 px and 390 px
    keep:
      - workspace-tab-other-sections   # no other Workspace settings page changes
    change:
      - background-agents-dm_title: "new section: DM title, no-agent note, Agent and Fallback agent selects"
      - background-agents-quick_actions: "new section: Quick actions, same two selects"
      - background-agents-routing: "new section: Routing, Workspace only badge, replaces the old routing-agent rows"
      - background-agents-dm_title-fallback: "fallback select is disabled until an Agent is picked; clearing the Agent clears it"
      - background-agents-conflict: "new compare panel when another owner saved first: Your change (not saved) beside Saved now, Keep their version, Apply my change again"
      - background-agents-load-error: "new alert with Retry when the response is unreadable; no selects are shown"
      - background-agents-member-read-only: "members see the picks as text with the read-only notice and a link to Personal"
    remove:
      - routing-agent-rows: "old Routing agent rows in the Workspace tab; replaced by the Routing section above"
